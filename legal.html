<style>
:root, :root[data-theme="dark"] {
  --bg:#0d1f2d; --surface:#132333; --border:rgba(255,255,255,0.10);
  --fg:#e8f0f7; --fg2:rgba(232,240,247,.72); --fg3:rgba(232,240,247,.45);
  --accent:#3db8a0; --on-accent:#0d1f2d; --warn:#e09430; color-scheme:dark;
}
:root[data-theme="light"] {
  --bg:#f3f6f8; --surface:#ffffff; --border:rgba(8,28,42,.18);
  --fg:#081c2a; --fg2:rgba(8,28,42,.82); --fg3:rgba(8,28,42,.6);
  --accent:#0a7563; --on-accent:#ffffff; --warn:#b35900; color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font-family:'DM Sans',system-ui,sans-serif;line-height:1.6;font-size:15px}
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--border);padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top,0px))}
.top-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.back{display:flex;align-items:center;gap:8px;color:var(--fg);text-decoration:none;font-weight:600;font-size:16px;margin-right:auto}
.logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(160deg,#1d4460 0%,#0d1f2d 62%,#081520 100%);border:1px solid rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center}
.logo svg{width:22px;height:22px;fill:#fff}
.langs{display:flex;gap:4px}
.langs button{background:var(--surface);border:1px solid var(--border);color:var(--fg2);border-radius:14px;padding:3px 9px;font:600 12px 'DM Mono',monospace;cursor:pointer}
.langs button.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.tabs{max-width:760px;margin:0 auto;display:flex;gap:6px;margin-top:10px}
.tabs a{flex:1;text-align:center;padding:8px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--fg2);text-decoration:none;font-weight:600;font-size:14px}
.tabs a.on{border-color:var(--accent);color:var(--accent)}
main{max-width:760px;margin:0 auto;padding:20px 16px calc(48px + env(safe-area-inset-bottom,0px))}
h1{font-size:24px;line-height:1.25;margin:8px 0 4px;letter-spacing:-.3px}
.updated{color:var(--fg3);font-size:13px;margin-bottom:18px;font-family:'DM Mono',monospace}
h2{font-size:17px;margin:26px 0 8px}
p,li{color:var(--fg2)}
p{margin-bottom:10px}
ul{padding-left:20px;margin-bottom:10px}
li{margin-bottom:6px}
strong{color:var(--fg)}
a{color:var(--accent)}
.box{border:1px solid var(--accent);background:var(--surface);border-radius:12px;padding:12px 14px;margin:12px 0}
.box p:last-child{margin-bottom:0}
table{width:100%;border-collapse:collapse;margin:8px 0 12px;font-size:14px}
th,td{text-align:left;vertical-align:top;padding:8px 6px;border-bottom:1px solid var(--border);color:var(--fg2)}
th{color:var(--fg);font-weight:600}
.pending{color:var(--warn);font-weight:700}
section{scroll-margin-top:120px}
</style>
</head>

  document.getElementById('tabTerms').textContent = ui.terms;
  const date = new Intl.DateTimeFormat(lang, { dateStyle:'long' }).format(new Date(UPDATED + 'T12:00:00'));
  const upd = `<p class="updated">${esc(ui.updated)}: ${esc(date)}</p>`;
  document.getElementById('privacy').innerHTML = fill(doc.privacy, ui).replace('</h1>', '</h1>' + upd);
  document.getElementById('terms').innerHTML = fill(doc.terms, ui).replace('</h1>', '</h1>' + upd);
  document.getElementById('langs').innerHTML = LANGS.map(l => `<button data-l="${l}" class="${l === lang ? 'on' : ''}">${l.toUpperCase()}</button>`).join('');
  markTab();
}
function markTab() {
  const terms = document.getElementById('terms').getBoundingClientRect().top < 160;
  document.getElementById('tabPriv').classList.toggle('on', !terms);
  document.getElementById('tabTerms').classList.toggle('on', terms);
}
document.getElementById('logo').innerHTML = ORCA.replace('viewBox="0 0 90 90"', 'viewBox="11.21 12.74 67.99 67.99"');
document.getElementById('langs').addEventListener('click', e => { const b = e.target.closest('button[data-l]'); if (b) render(b.dataset.l, true); });
addEventListener('scroll', markTab, { passive:true });
render(pickLang(), false);
if (location.hash) { const el = document.querySelector(location.hash); if (el) el.scrollIntoView(); }
</script>
</body>
</html>
