<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Orcinus</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap">

<style>
:root {
  --bg:#0d1f2d; --ocean:#091622; --surface:#132333; --surface2:#1a2f42;
  --border:rgba(255,255,255,0.10); --fg:#e8f0f7; --fg2:rgba(232,240,247,.60); --fg3:rgba(232,240,247,.35);
  --accent:#3db8a0; --accent-dim:rgba(61,184,160,.18);
  --red:#e05252; --red-dim:rgba(224,82,82,.18);
  --orange:#e09430; --orange-dim:rgba(224,148,48,.18);
  --green:#3db884; --green-dim:rgba(61,184,132,.18);
  --font:'DM Sans',system-ui,sans-serif; --mono:'DM Mono',monospace; --radius:14px;
  color-scheme:dark;
}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#dff0f7;--ocean:#9ec8e0;--surface:#fff;--surface2:#eaf5fb;
  --border:rgba(0,0,0,.09);--fg:#0d1f2d;--fg2:rgba(13,31,45,.6);--fg3:rgba(13,31,45,.35);
  --accent:#1a9680;--accent-dim:rgba(26,150,128,.12);
  --red:#c73b3b;--red-dim:rgba(199,59,59,.10);--orange:#b57020;--orange-dim:rgba(181,112,32,.10);
  --green:#1a9660;--green-dim:rgba(26,150,96,.10);color-scheme:light;
}}
:root[data-theme="light"]{
  --bg:#dff0f7;--ocean:#9ec8e0;--surface:#fff;--surface2:#eaf5fb;
  --border:rgba(0,0,0,.09);--fg:#0d1f2d;--fg2:rgba(13,31,45,.6);--fg3:rgba(13,31,45,.35);
  --accent:#1a9680;--accent-dim:rgba(26,150,128,.12);
  --red:#c73b3b;--red-dim:rgba(199,59,59,.10);--orange:#b57020;--orange-dim:rgba(181,112,32,.10);
  --green:#1a9660;--green-dim:rgba(26,150,96,.10);color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:var(--font);background:var(--bg);color:var(--fg);overflow:hidden}

/* layout */
#app{display:flex;flex-direction:column;height:100%;position:relative}

/* header */
#header{
  position:absolute;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:100;
  display:flex;align-items:center;gap:10px;
  padding:12px max(16px,env(safe-area-inset-left,0px));
  background:linear-gradient(to bottom,rgba(13,31,45,.95) 70%,transparent);
  pointer-events:none;
}
#header>*{pointer-events:auto}
.app-logo{width:36px;height:36px;background:var(--accent);border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.app-name{font-size:18px;font-weight:600;letter-spacing:-.3px;flex:1}
.app-name span{color:var(--accent)}
.header-pill{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:6px 12px;font-size:12px;color:var(--fg2);font-family:var(--mono);display:flex;align-items:center;gap:6px}
.header-pill .dot{width:6px;height:6px;border-radius:50%;background:var(--green)}

/* map */
#mapWrap{flex:1;position:relative;overflow:hidden;touch-action:none}
#mapCanvas{display:block;width:100%;height:100%;cursor:grab}
#mapCanvas.dragging{cursor:grabbing}
#markersLayer{position:absolute;inset:0;pointer-events:none;z-index:20}

/* zoom buttons */
#zoomCtrl{position:absolute;right:12px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:4px;z-index:50}
.zoom-btn{width:36px;height:36px;border-radius:8px;background:var(--surface);border:1px solid var(--border);color:var(--fg);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}

/* markers */
.orca-marker{position:absolute;width:40px;height:40px;transform:translate(-50%,-50%);border-radius:50%;display:flex;align-items:center;justify-content:center;border:2.5px solid transparent;pointer-events:auto;cursor:pointer}
.orca-marker svg{width:22px;height:22px}
.orca-marker .cbadge{position:absolute;top:-4px;right:-4px;background:#fff;color:#0d1f2d;border-radius:50%;width:17px;height:17px;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;font-family:var(--mono)}
.user-dot{position:absolute;width:18px;height:18px;transform:translate(-50%,-50%);border-radius:50%;background:#4a90d9;border:3px solid #fff;box-shadow:0 0 0 6px rgba(74,144,217,.25);pointer-events:none}

/* popup */
#popup{position:absolute;z-index:200;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;min-width:190px;pointer-events:auto;box-shadow:0 8px 32px rgba(0,0,0,.5)}
.popup-type{font-size:11px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;margin-bottom:6px}
.popup-time{font-size:12px;color:var(--fg2);margin-bottom:8px;font-family:var(--mono)}
.popup-notes{font-size:13px;color:var(--fg2);margin-bottom:8px}
.popup-count{font-size:12px;color:var(--fg3);margin-bottom:10px}
.confirm-row{display:flex;align-items:center;gap:8px}
.confirm-btn{flex:1;padding:8px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--fg2);font-family:var(--font);font-size:12px;font-weight:500;cursor:pointer}
.confirm-count{font-size:12px;color:var(--fg3);font-family:var(--mono)}
.popup-close{position:absolute;top:8px;right:8px;background:none;border:none;color:var(--fg3);font-size:14px;cursor:pointer}

/* panel */
#panel{position:absolute;bottom:0;left:0;right:0;z-index:100;background:var(--surface);border-top:1px solid var(--border);border-radius:var(--radius) var(--radius) 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px))}
.panel-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 16px}
.slider-row{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.slider-label{font-size:11px;color:var(--fg3);font-family:var(--mono);white-space:nowrap;min-width:56px}
#timeRange{flex:1;-webkit-appearance:none;height:3px;background:var(--surface2);border-radius:2px;outline:none}
#timeRange::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--accent);cursor:pointer;box-shadow:0 0 0 3px var(--accent-dim)}
.slider-val{font-size:12px;font-family:var(--mono);color:var(--accent);min-width:28px;text-align:right}
.legend{display:flex;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.legend-item{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--fg2)}
.legend-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
#reportBtn{width:100%;padding:14px;border-radius:12px;background:var(--accent);border:none;color:#0d1f2d;font-family:var(--font);font-size:15px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
#reportBtn:active{opacity:.85}

/* modal */
#modalBg{position:fixed;inset:0;background:rgba(13,31,45,.85);z-index:300;display:flex;align-items:flex-end;padding:0 max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#modal{background:var(--surface);border-radius:var(--radius) var(--radius) 0 0;border:1px solid var(--border);border-bottom:none;padding:20px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));width:100%;max-width:520px;margin:0 auto}
.modal-title{font-size:16px;font-weight:600;margin-bottom:18px;display:flex;align-items:center;gap:8px}
.modal-close{margin-left:auto;background:var(--surface2);border:1px solid var(--border);border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--fg2);font-size:16px}
.field-label{font-size:11px;font-weight:500;color:var(--fg3);text-transform:uppercase;letter-spacing:.7px;margin-bottom:8px}
.type-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px}
.type-btn{padding:12px 8px;border-radius:10px;border:1.5px solid var(--border);background:var(--surface2);color:var(--fg2);font-family:var(--font);font-size:12px;font-weight:500;cursor:pointer;text-align:center;line-height:1.4}
.type-btn .type-icon{display:block;font-size:20px;margin-bottom:4px}
.type-btn.active-red{border-color:var(--red);background:var(--red-dim);color:var(--fg)}
.type-btn.active-orange{border-color:var(--orange);background:var(--orange-dim);color:var(--fg)}
.type-btn.active-green{border-color:var(--green);background:var(--green-dim);color:var(--fg)}
.count-row{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.count-btn{width:36px;height:36px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--fg);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}
#countVal{font-size:22px;font-weight:600;font-family:var(--mono);min-width:30px;text-align:center}
.notes-input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--surface2);color:var(--fg);font-family:var(--font);font-size:14px;outline:none;resize:none;margin-bottom:16px}
.notes-input:focus{border-color:var(--accent)}
.notes-input::placeholder{color:var(--fg3)}
#submitBtn{width:100%;padding:14px;border-radius:12px;background:var(--accent);border:none;color:#0d1f2d;font-family:var(--font);font-size:15px;font-weight:600;cursor:pointer}

/* toast */
#toast{position:fixed;bottom:240px;left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--accent);border-radius:20px;padding:10px 20px;font-size:13px;font-weight:500;color:var(--accent);z-index:400;transition:opacity .3s;white-space:nowrap;pointer-events:none}
</style>

<div id="app">
  <div id="header">
    <div class="app-logo">
      <svg viewBox="0 0 24 24" fill="none" width="22" height="22">
        <path d="M3 15 Q6 8 11 10 Q14 11 16 9 Q18 7 19 5 L20 8 Q22 10 20 13 Q18 16 14 16 Q10 16 8 18 Q5 20 3 19Z" fill="#0d1f2d"/>
        <path d="M19 5 L21 3 L20 7Z" fill="#0d1f2d"/>
      </svg>
    </div>
    <span class="app-name">Orci<span>nus</span></span>
    <div class="header-pill"><span class="dot"></span><span id="sightCount">0 activos</span></div>
  </div>

  <div id="mapWrap">
    <canvas id="mapCanvas"></canvas>
    <div id="markersLayer"></div>
    <div id="zoomCtrl">
      <button class="zoom-btn" id="zoomIn">+</button>
      <button class="zoom-btn" id="zoomOut">−</button>
    </div>
    <div id="popup" hidden></div>
  </div>

  <div id="panel">
    <div class="panel-handle"></div>
    <div class="slider-row">
      <span class="slider-label">Historial</span>
      <input type="range" id="timeRange" min="1" max="72" value="24" step="1">
      <span class="slider-val" id="timeVal">24h</span>
    </div>
    <div class="legend">
      <div class="legend-item"><div class="legend-dot" style="background:var(--red)"></div>Contacto</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--orange)"></div>Interacción</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--green)"></div>Observación</div>
      <div class="legend-item" style="opacity:.4"><div class="legend-dot" style="background:#888"></div>Antiguo</div>
    </div>
    <button id="reportBtn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Reportar avistamiento
    </button>
  </div>
</div>

<div id="modalBg" hidden>
  <div id="modal">
    <div class="modal-title">🐋 Nuevo avistamiento<button class="modal-close" id="closeModal">✕</button></div>
    <div class="field-label">Tipo de interacción</div>
    <div class="type-grid">
      <button class="type-btn" data-type="observation" data-color="green"><span class="type-icon">🟢</span>Observación</button>
      <button class="type-btn" data-type="interaction" data-color="orange"><span class="type-icon">🟠</span>Interacción</button>
      <button class="type-btn" data-type="contact" data-color="red"><span class="type-icon">🔴</span>Contacto</button>
    </div>
    <div class="field-label">Número de individuos</div>
    <div class="count-row">
      <button class="count-btn" id="countMinus">−</button>
      <span id="countVal">1</span>
      <button class="count-btn" id="countPlus">+</button>
    </div>
    <div class="field-label">Notas (opcional)</div>
    <textarea class="notes-input" id="notesInput" rows="2" placeholder="Ej: grupo familiar, macho con aleta alta..."></textarea>
    <button id="submitBtn">Confirmar avistamiento</button>
  </div>
</div>

<div id="toast" hidden></div>

<script>
// ── data ─────────────────────────────────────────────
const SAMPLE = [
  {id:'s1',lat:42.250,lng:-8.720,type:'contact',    color:'red',   time:Date.now()-22*60000,   count:3,notes:'Contacto con el casco',confirms:5},
  {id:'s2',lat:42.190,lng:-8.850,type:'interaction',color:'orange',time:Date.now()-75*60000,   count:6,notes:'Se acercaron al barco, muy activas',confirms:3},
  {id:'s3',lat:42.310,lng:-8.610,type:'observation',color:'green', time:Date.now()-240*60000,  count:2,notes:'',confirms:2},
  {id:'s4',lat:42.100,lng:-8.950,type:'observation',color:'green', time:Date.now()-18*3600000, count:4,notes:'Grupo con cría',confirms:1},
  {id:'s5',lat:42.280,lng:-8.790,type:'contact',    color:'red',   time:Date.now()-6*3600000,  count:1,notes:'',confirms:1},
];
let sightings=[];
try{const s=localStorage.getItem('orcinus_v3');if(s)sightings=JSON.parse(s);}catch(e){}
if(!sightings.length){sightings=SAMPLE;try{localStorage.setItem('orcinus_v3',JSON.stringify(sightings));}catch(e){}}

// ── map engine (canvas + Web Mercator) ───────────────
const canvas=document.getElementById('mapCanvas');
const ctx=canvas.getContext('2d');
const mapWrap=document.getElementById('mapWrap');
const TILE=256;

let zoom=11, centerLat=42.22, centerLng=-8.81;
let userLat=42.22, userLng=-8.81;

function toWorld(lat,lng){
  const s=TILE*Math.pow(2,zoom);
  const x=(lng+180)/360*s;
  const sinLat=Math.sin(lat*Math.PI/180);
  const y=(0.5-Math.log((1+sinLat)/(1-sinLat))/(4*Math.PI))*s;
  return{x,y};
}
function toLatLng(wx,wy){
  const s=TILE*Math.pow(2,zoom);
  const lng=wx/s*360-180;
  const n=Math.PI-2*Math.PI*wy/s;
  const lat=180/Math.PI*Math.atan(0.5*(Math.exp(n)-Math.exp(-n)));
  return{lat,lng};
}
function lltoc(lat,lng){
  const cw=toWorld(centerLat,centerLng),pw=toWorld(lat,lng);
  return{x:pw.x-cw.x+canvas.width/2,y:pw.y-cw.y+canvas.height/2};
}
function ctoll(cx,cy){
  const cw=toWorld(centerLat,centerLng);
  return toLatLng(cw.x+cx-canvas.width/2,cw.y+cy-canvas.height/2);
}

// ── land polygons — Ría de Vigo ──────────────────────
const LAND=[
  // Costa norte / Vigo city
  [[42.50,-8.38],[42.42,-8.44],[42.34,-8.51],[42.295,-8.565],[42.26,-8.622],
   [42.228,-8.668],[42.205,-8.722],[42.186,-8.782],[42.177,-8.850],
   [42.175,-8.940],[42.190,-9.008],[42.220,-9.050],[42.275,-9.085],
   [42.36,-9.128],[42.50,-9.15]],
  // Península do Morrazo
  [[42.228,-8.668],[42.196,-8.636],[42.162,-8.648],[42.128,-8.692],
   [42.098,-8.762],[42.070,-8.865],[42.093,-8.980],[42.145,-9.018],
   [42.180,-8.942],[42.198,-8.850],[42.218,-8.755],[42.228,-8.668]],
  // Illas Cíes Norte
  [[42.249,-8.912],[42.239,-8.897],[42.225,-8.901],[42.231,-8.916]],
  // Illas Cíes Sur
  [[42.217,-8.902],[42.208,-8.891],[42.201,-8.897],[42.208,-8.910]],
];

// ── draw map ─────────────────────────────────────────
function isDark(){
  if(document.documentElement.dataset.theme==='dark') return true;
  if(document.documentElement.dataset.theme==='light') return false;
  return window.matchMedia('(prefers-color-scheme:dark)').matches;
}

function drawMap(){
  canvas.width=mapWrap.clientWidth;
  canvas.height=mapWrap.clientHeight;
  const dk=isDark();
  const ocean   = dk?'#091622':'#9ec8e0';
  const shallow = dk?'rgba(14,42,68,.5)':'rgba(160,205,230,.5)';
  const landFill= dk?'#223d1a':'#3a6b2a';
  const landEdge= dk?'#182e12':'#2d5520';
  const grid    = dk?'rgba(255,255,255,.04)':'rgba(0,0,80,.05)';

  // ocean
  ctx.fillStyle=ocean;
  ctx.fillRect(0,0,canvas.width,canvas.height);

  // shallow depth in the ría
  const c=lltoc(42.19,-8.79);
  const gr=ctx.createRadialGradient(c.x,c.y,10,c.x,c.y,canvas.width*.65);
  gr.addColorStop(0,shallow); gr.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=gr; ctx.fillRect(0,0,canvas.width,canvas.height);

  // coord grid (nautical chart style)
  ctx.strokeStyle=grid; ctx.lineWidth=1;
  const step=zoom<11?.2:.1;
  for(let lat=41.7;lat<=42.7;lat+=step){
    const a=lltoc(lat,-9.5),b=lltoc(lat,-8.0);
    ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
  }
  for(let lng=-9.5;lng<=-8.0;lng+=step){
    const a=lltoc(41.7,lng),b=lltoc(42.7,lng);
    ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
  }

  // land
  LAND.forEach(poly=>{
    ctx.fillStyle=landFill; ctx.strokeStyle=landEdge; ctx.lineWidth=1.5;
    ctx.beginPath();
    poly.forEach(([lat,lng],i)=>{
      const p=lltoc(lat,lng);i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y);
    });
    ctx.closePath(); ctx.fill(); ctx.stroke();
  });

  // optional: label the ría
  const label=lltoc(42.19,-8.79);
  ctx.fillStyle=dk?'rgba(255,255,255,.12)':'rgba(0,60,120,.18)';
  ctx.font=`italic 13px Georgia,serif`;
  ctx.textAlign='center';
  ctx.fillText('Ría de Vigo',label.x,label.y);
}

// ── markers ──────────────────────────────────────────
const markersLayer=document.getElementById('markersLayer');
const ORCA=`<svg viewBox="0 0 32 32" fill="none"><path d="M4 20 Q8 11 15 13 Q19 14 22 12 Q24 9 26 6 L27 10 Q30 13 27 17 Q24 21 19 21 Q13 21 11 24 Q7 27 4 26Z" fill="white"/><path d="M26 6 L28 3 L27 9Z" fill="white"/></svg>`;
const TC={red:{bg:'rgba(224,82,82,.88)',bc:'rgba(255,140,140,.75)'},orange:{bg:'rgba(224,148,48,.88)',bc:'rgba(255,200,100,.7)'},green:{bg:'rgba(61,184,132,.88)',bc:'rgba(100,230,170,.7)'}};

let hoursWindow=24, markerEls={}, userDot=null, openId=null;

function ageMins(t){return(Date.now()-t)/60000}
function getOp(t,maxH){const m=ageMins(t),mx=maxH*60;if(m>mx)return 0;return Math.max(.12,1-(m/mx)*.88)}
function fmtT(t){const m=ageMins(t);if(m<60)return`Hace ${Math.round(m)} min`;if(m<1440)return`Hace ${Math.round(m/60)} h`;return`Hace ${Math.round(m/1440)} días`}
function typeL(t){return{contact:'Contacto físico',interaction:'Interacción',observation:'Observación'}[t]||t}
function typeC(c){return{red:'var(--red)',orange:'var(--orange)',green:'var(--green)'}[c]}

function renderMarkers(){
  // user dot
  const up=lltoc(userLat,userLng);
  if(!userDot){userDot=document.createElement('div');userDot.className='user-dot';markersLayer.appendChild(userDot);}
  userDot.style.left=up.x+'px'; userDot.style.top=up.y+'px';

  let active=0;
  sightings.forEach(s=>{
    const op=getOp(s.time,hoursWindow);
    let el=markerEls[s.id];
    if(op<=0){if(el){el.remove();delete markerEls[s.id];}return;}
    if(!el){
      el=document.createElement('div'); el.className='orca-marker';
      el.addEventListener('click',()=>showPopup(s));
      markersLayer.appendChild(el); markerEls[s.id]=el;
    }
    const c=TC[s.color];
    el.style.cssText=`background:${c.bg};border-color:${c.bc};opacity:${op};position:absolute;width:40px;height:40px;transform:translate(-50%,-50%);border-radius:50%;display:flex;align-items:center;justify-content:center;border:2.5px solid;pointer-events:auto;cursor:pointer`;
    el.innerHTML=ORCA+(s.confirms>0?`<div class="cbadge">${s.confirms}</div>`:'');
    el.onclick=()=>showPopup(s);
    const p=lltoc(s.lat,s.lng);
    el.style.left=p.x+'px'; el.style.top=p.y+'px';
    if(op>.2)active++;
  });
  document.getElementById('sightCount').textContent=`${active} activos`;
}

// ── popup ────────────────────────────────────────────
const popup=document.getElementById('popup');
function showPopup(s){
  openId=s.id;
  popup.innerHTML=`
    <button class="popup-close" onclick="closePopup()">✕</button>
    <div class="popup-type" style="color:${typeC(s.color)}">${typeL(s.type)}</div>
    <div class="popup-time">${fmtT(s.time)}</div>
    ${s.count>1?`<div class="popup-count">${s.count} individuos</div>`:''}
    ${s.notes?`<div class="popup-notes">${s.notes}</div>`:''}
    <div class="confirm-row">
      <button class="confirm-btn" onclick="doConfirm('${s.id}')">✓ Confirmar</button>
      <span class="confirm-count">${s.confirms} confirmaciones</span>
    </div>`;
  const p=lltoc(s.lat,s.lng);
  let left=p.x-95, top=p.y-165;
  if(left<8)left=8; if(left+200>canvas.width)left=canvas.width-208;
  if(top<60)top=p.y+30;
  popup.style.left=left+'px'; popup.style.top=top+'px'; popup.hidden=false;
}
function reposPopup(){
  if(popup.hidden||!openId)return;
  const s=sightings.find(x=>x.id===openId); if(!s)return;
  const p=lltoc(s.lat,s.lng);
  let left=p.x-95,top=p.y-165;
  if(left<8)left=8;if(left+200>canvas.width)left=canvas.width-208;
  if(top<60)top=p.y+30;
  popup.style.left=left+'px';popup.style.top=top+'px';
}
window.closePopup=()=>{popup.hidden=true;openId=null};
window.doConfirm=id=>{
  const s=sightings.find(x=>x.id===id);if(!s)return;
  s.confirms++;
  try{localStorage.setItem('orcinus_v3',JSON.stringify(sightings));}catch(e){}
  closePopup(); renderMarkers(); showToast('Confirmación añadida ✓');
};

// ── pan & zoom ───────────────────────────────────────
function doZoom(delta,cx,cy){
  const before=ctoll(cx??canvas.width/2,cy??canvas.height/2);
  zoom=Math.max(9,Math.min(14,zoom+delta));
  const pivot=toWorld(before.lat,before.lng);
  const cw=toWorld(centerLat,centerLng);
  // keep pivot point under cursor
  const nc=toLatLng(pivot.x+(canvas.width/2-(cx??canvas.width/2)),pivot.y+(canvas.height/2-(cy??canvas.height/2)));
  centerLat=nc.lat; centerLng=nc.lng;
  redraw();
}
function panBy(dx,dy){
  const cw=toWorld(centerLat,centerLng);
  const nc=toLatLng(cw.x-dx,cw.y-dy);
  centerLat=nc.lat; centerLng=nc.lng; redraw();
}
function redraw(){drawMap();renderMarkers();reposPopup();}

// mouse
let drag=false,lx=0,ly=0;
canvas.addEventListener('mousedown',e=>{drag=true;lx=e.clientX;ly=e.clientY;canvas.classList.add('dragging');closePopup();});
window.addEventListener('mousemove',e=>{if(!drag)return;panBy(e.clientX-lx,e.clientY-ly);lx=e.clientX;ly=e.clientY;});
window.addEventListener('mouseup',()=>{drag=false;canvas.classList.remove('dragging');});
canvas.addEventListener('wheel',e=>{
  e.preventDefault();
  const r=canvas.getBoundingClientRect();
  doZoom(e.deltaY<0?1:-1,e.clientX-r.left,e.clientY-r.top);
},{passive:false});

// touch
let lastTouch=null,lastDist=0;
mapWrap.addEventListener('touchstart',e=>{
  closePopup();
  if(e.touches.length===1){lastTouch=e.touches[0];lx=lastTouch.clientX;ly=lastTouch.clientY;}
  else if(e.touches.length===2){lastDist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);}
},{passive:true});
mapWrap.addEventListener('touchmove',e=>{
  e.preventDefault();
  if(e.touches.length===1&&lastTouch){
    panBy(e.touches[0].clientX-lx,e.touches[0].clientY-ly);
    lx=e.touches[0].clientX;ly=e.touches[0].clientY;
  } else if(e.touches.length===2){
    const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    if(Math.abs(d-lastDist)>15){doZoom(d>lastDist?1:-1);lastDist=d;}
  }
},{passive:false});
mapWrap.addEventListener('touchend',()=>{lastTouch=null;});

document.getElementById('zoomIn').addEventListener('click',()=>doZoom(1));
document.getElementById('zoomOut').addEventListener('click',()=>doZoom(-1));

// ── slider ────────────────────────────────────────────
const timeRange=document.getElementById('timeRange');
const timeVal=document.getElementById('timeVal');
timeRange.addEventListener('input',()=>{hoursWindow=parseInt(timeRange.value);timeVal.textContent=hoursWindow+'h';renderMarkers();});

// ── report modal ──────────────────────────────────────
let selType=null,cnt=1;
const modalBg=document.getElementById('modalBg');
document.getElementById('reportBtn').addEventListener('click',()=>{modalBg.hidden=false;});
document.getElementById('closeModal').addEventListener('click',()=>{modalBg.hidden=true;});
modalBg.addEventListener('click',e=>{if(e.target===modalBg)modalBg.hidden=true;});
document.querySelectorAll('.type-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.type-btn').forEach(b=>b.className='type-btn');
    selType=btn.dataset.type; btn.classList.add('active-'+btn.dataset.color);
  });
});
const countVal=document.getElementById('countVal');
document.getElementById('countMinus').addEventListener('click',()=>{if(cnt>1)countVal.textContent=--cnt;});
document.getElementById('countPlus').addEventListener('click',()=>{if(cnt<20)countVal.textContent=++cnt;});
document.getElementById('submitBtn').addEventListener('click',()=>{
  if(!selType){showToast('Selecciona el tipo de interacción');return;}
  const cm={observation:'green',interaction:'orange',contact:'red'};
  const s={id:'u'+Date.now(),lat:userLat+(Math.random()-.5)*.015,lng:userLng+(Math.random()-.5)*.02,
    type:selType,color:cm[selType],time:Date.now(),count:cnt,
    notes:document.getElementById('notesInput').value.trim(),confirms:0};
  sightings.unshift(s);
  try{localStorage.setItem('orcinus_v3',JSON.stringify(sightings));}catch(e){}
  modalBg.hidden=true; selType=null; cnt=1;
  document.querySelectorAll('.type-btn').forEach(b=>b.className='type-btn');
  countVal.textContent='1'; document.getElementById('notesInput').value='';
  centerLat=s.lat; centerLng=s.lng; redraw();
  showToast('¡Avistamiento añadido!');
});

// ── geolocation ───────────────────────────────────────
if(navigator.geolocation){
  navigator.geolocation.watchPosition(p=>{
    userLat=p.coords.latitude; userLng=p.coords.longitude;
    if(userDot)renderMarkers();
  },()=>{},{enableHighAccuracy:true});
}

// ── toast ─────────────────────────────────────────────
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.hidden=false;t.style.opacity='1';
  setTimeout(()=>{t.style.opacity='0';setTimeout(()=>{t.hidden=true;},300);},2200);
}

// ── init ─────────────────────────────────────────────
new ResizeObserver(()=>redraw()).observe(mapWrap);
redraw();
setInterval(renderMarkers,60000);
</script>

</body></html>
