<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orcinus</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0d1f2d; --surface:#132333; --surface2:#1a2f42;
  --border:rgba(255,255,255,0.10); --fg:#e8f0f7; --fg2:rgba(232,240,247,.60); --fg3:rgba(232,240,247,.35);
  --accent:#3db8a0; --accent-dim:rgba(61,184,160,.18);
  --red:#e05252; --red-dim:rgba(224,82,82,.18);
  --orange:#e09430; --orange-dim:rgba(224,148,48,.18);
  --green:#3db884; --green-dim:rgba(61,184,132,.18);
  --font:'DM Sans',system-ui,sans-serif; --mono:'DM Mono',monospace; --radius:14px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:var(--font);background:var(--bg);color:var(--fg);overflow:hidden}

#app{display:flex;flex-direction:column;height:100%;position:relative}

/* header */
#header{
  position:absolute;top:0;left:0;right:0;z-index:1000;
  display:flex;align-items:center;gap:10px;
  padding:12px 16px;
  background:linear-gradient(to bottom,rgba(13,31,45,.95) 70%,transparent);
  pointer-events:none;
}
#header>*{pointer-events:auto}
.app-logo{width:36px;height:36px;background:var(--accent);border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.app-name{font-size:18px;font-weight:600;letter-spacing:-.3px;flex:1}
.app-name span{color:var(--accent)}
.header-pill{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:6px 12px;font-size:12px;color:var(--fg2);font-family:var(--mono);display:flex;align-items:center;gap:6px}
.header-pill .dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* map */
#map{flex:1;position:relative;z-index:1}

/* leaflet overrides — nautical tint */
.leaflet-tile-pane { filter: saturate(0.85) brightness(0.92) hue-rotate(10deg); }
.leaflet-control-zoom{border:1px solid var(--border)!important;border-radius:8px!important;overflow:hidden}
.leaflet-control-zoom a{background:var(--surface)!important;color:var(--fg)!important;border-color:var(--border)!important}
.leaflet-control-zoom a:hover{background:var(--surface2)!important}
.leaflet-control-attribution{background:rgba(13,31,45,.7)!important;color:var(--fg3)!important;font-size:10px!important}
.leaflet-control-attribution a{color:var(--fg2)!important}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{display:none}

/* custom markers */
.orca-pin{
  width:40px;height:40px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  border:2.5px solid transparent;cursor:pointer;
  box-shadow:0 2px 8px rgba(0,0,0,.4);
  position:relative;
}
.orca-pin svg{width:28px;height:28px}
.orca-pin .cbadge{
  position:absolute;top:-4px;right:-4px;
  background:#fff;color:#0d1f2d;border-radius:50%;
  width:17px;height:17px;font-size:9px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);
}
.user-pin{
  width:18px;height:18px;border-radius:50%;
  background:#4a90d9;border:3px solid #fff;
  box-shadow:0 0 0 6px rgba(74,144,217,.25);
}

/* popup */
#popup{
  position:fixed;z-index:2000;
  background:var(--surface);border:1px solid var(--border);
  border-radius:12px;padding:14px;min-width:190px;
  box-shadow:0 8px 32px rgba(0,0,0,.5);
  display:none;
}
.popup-type{font-size:11px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;margin-bottom:6px}
.popup-time{font-size:12px;color:var(--fg2);margin-bottom:8px;font-family:var(--mono)}
.popup-notes{font-size:13px;color:var(--fg2);margin-bottom:8px}
.popup-count{font-size:12px;color:var(--fg3);margin-bottom:10px}
.confirm-row{display:flex;align-items:center;gap:8px}
.confirm-btn{flex:1;padding:8px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--fg2);font-family:var(--font);font-size:12px;font-weight:500;cursor:pointer}
.confirm-btn:hover{border-color:var(--accent);color:var(--accent)}
.confirm-count{font-size:12px;color:var(--fg3);font-family:var(--mono)}
.popup-close{position:absolute;top:8px;right:8px;background:none;border:none;color:var(--fg3);font-size:14px;cursor:pointer}

/* panel */
#panel{
  position:absolute;bottom:0;left:0;right:0;z-index:1000;
  background:var(--surface);border-top:1px solid var(--border);
  border-radius:var(--radius) var(--radius) 0 0;
  padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));
}
.panel-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 16px}
.slider-row{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.slider-label{font-size:11px;color:var(--fg3);font-family:var(--mono);white-space:nowrap;min-width:56px}
#timeRange{flex:1;-webkit-appearance:none;height:3px;background:var(--surface2);border-radius:2px;outline:none}
#timeRange::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--accent);cursor:pointer;box-shadow:0 0 0 3px var(--accent-dim)}
.slider-val{font-size:12px;font-family:var(--mono);color:var(--accent);min-width:28px;text-align:right}
.legend{display:flex;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.legend-item{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--fg2)}
.legend-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
#reportBtn{width:100%;padding:14px;border-radius:12px;background:var(--accent);border:none;color:#0d1f2d;font-family:var(--font);font-size:15px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
#reportBtn:active{opacity:.85}

/* modal */
#modalBg{position:fixed;inset:0;background:rgba(13,31,45,.85);z-index:3000;display:none;align-items:flex-end;padding:0 16px}
#modal{background:var(--surface);border-radius:var(--radius) var(--radius) 0 0;border:1px solid var(--border);border-bottom:none;padding:20px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));width:100%;max-width:520px;margin:0 auto}
.modal-title{font-size:16px;font-weight:600;margin-bottom:18px;display:flex;align-items:center;gap:8px}
.modal-close{margin-left:auto;background:var(--surface2);border:1px solid var(--border);border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--fg2);font-size:16px}
.field-label{font-size:11px;font-weight:500;color:var(--fg3);text-transform:uppercase;letter-spacing:.7px;margin-bottom:8px}
.type-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px}
.type-btn{padding:12px 8px;border-radius:10px;border:1.5px solid var(--border);background:var(--surface2);color:var(--fg2);font-family:var(--font);font-size:12px;font-weight:500;cursor:pointer;text-align:center;line-height:1.4}
.type-btn .type-icon{display:block;font-size:20px;margin-bottom:4px}
.type-btn.active-red{border-color:var(--red);background:var(--red-dim);color:var(--fg)}
.type-btn.active-orange{border-color:var(--orange);background:var(--orange-dim);color:var(--fg)}
.type-btn.active-green{border-color:var(--green);background:var(--green-dim);color:var(--fg)}
.count-row{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.count-btn{width:36px;height:36px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--fg);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}
#countVal{font-size:22px;font-weight:600;font-family:var(--mono);min-width:30px;text-align:center}
.notes-input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--surface2);color:var(--fg);font-family:var(--font);font-size:14px;outline:none;resize:none;margin-bottom:16px}
.notes-input:focus{border-color:var(--accent)}
.notes-input::placeholder{color:var(--fg3)}
#submitBtn{width:100%;padding:14px;border-radius:12px;background:var(--accent);border:none;color:#0d1f2d;font-family:var(--font);font-size:15px;font-weight:600;cursor:pointer}

/* toast */
#toast{position:fixed;bottom:200px;left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--accent);border-radius:20px;padding:10px 20px;font-size:13px;font-weight:500;color:var(--accent);z-index:4000;transition:opacity .3s;white-space:nowrap;pointer-events:none;display:none}
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <div class="app-logo">
      <svg viewBox="0 0 24 24" fill="none" width="22" height="22">
        <path d="M3 15 Q6 8 11 10 Q14 11 16 9 Q18 7 19 5 L20 8 Q22 10 20 13 Q18 16 14 16 Q10 16 8 18 Q5 20 3 19Z" fill="#0d1f2d"/>
        <path d="M19 5 L21 3 L20 7Z" fill="#0d1f2d"/>
      </svg>
    </div>
    <span class="app-name">Orci<span>nus</span></span>
    <div class="header-pill"><span class="dot"></span><span id="sightCount">0 activos</span></div>
  </div>

  <div id="map"></div>

  <div id="panel">
    <div class="panel-handle"></div>
    <div class="slider-row">
      <span class="slider-label">Historial</span>
      <input type="range" id="timeRange" min="1" max="72" value="72" step="1">
      <span class="slider-val" id="timeVal">24h</span>
    </div>
    <div class="legend">
      <div class="legend-item"><div class="legend-dot" style="background:var(--red)"></div>Contacto</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--orange)"></div>Interacción</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--green)"></div>Observación</div>
      <div class="legend-item" style="opacity:.4"><div class="legend-dot" style="background:#888"></div>Antiguo</div>
    </div>
    <button id="reportBtn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Reportar avistamiento
    </button>
  </div>
</div>

<div id="popup">
  <button class="popup-close" onclick="closePopup()">✕</button>
  <div id="popupContent"></div>
</div>

<div id="modalBg">
  <div id="modal">
    <div class="modal-title">🐋 Nuevo avistamiento<button class="modal-close" id="closeModal">✕</button></div>
    <div class="field-label">Tipo de interacción</div>
    <div class="type-grid">
      <button class="type-btn" data-type="observation" data-color="green"><span class="type-icon">🟢</span>Observación</button>
      <button class="type-btn" data-type="interaction" data-color="orange"><span class="type-icon">🟠</span>Interacción</button>
      <button class="type-btn" data-type="contact" data-color="red"><span class="type-icon">🔴</span>Contacto</button>
    </div>
    <div class="field-label">Número de individuos</div>
    <div class="count-row">
      <button class="count-btn" id="countMinus">−</button>
      <span id="countVal">1</span>
      <button class="count-btn" id="countPlus">+</button>
    </div>
    <div class="field-label">Notas (opcional)</div>
    <textarea class="notes-input" id="notesInput" rows="2" placeholder="Ej: grupo familiar, macho con aleta alta..."></textarea>
    <button id="submitBtn">Confirmar avistamiento</button>
  </div>
</div>

<div id="toast"></div>

<script>
// ── data ──────────────────────────────────────────────
const SAMPLE = [
  {id:'s1',lat:42.215,lng:-8.832,type:'contact',    color:'red',   time:Date.now()-18*60000,   count:3,notes:'Contacto con el casco',confirms:5},
  {id:'s2',lat:42.178,lng:-8.868,type:'interaction',color:'orange',time:Date.now()-55*60000,   count:6,notes:'Se acercaron al barco, muy activas',confirms:3},
  {id:'s3',lat:42.238,lng:-8.795,type:'observation',color:'green', time:Date.now()-4*3600000,  count:2,notes:'',confirms:2},
  {id:'s4',lat:42.152,lng:-8.912,type:'observation',color:'green', time:Date.now()-18*3600000, count:4,notes:'Grupo con cría',confirms:1},
  {id:'s5',lat:42.196,lng:-8.855,type:'contact',    color:'red',   time:Date.now()-6*3600000,  count:1,notes:'',confirms:1},
];
let sightings = [];
try { const s = localStorage.getItem('orcinus_v5'); if(s) sightings = JSON.parse(s); } catch(e) {}
if (!sightings.length) { sightings = SAMPLE; try { localStorage.setItem('orcinus_v5', JSON.stringify(sightings)); } catch(e) {} }

// ── map ───────────────────────────────────────────────
const map = L.map('map', {
  center: [42.22, -8.81],
  zoom: 11,
  zoomControl: true,
  attributionControl: true,
});

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> | Orca icon by <a href="https://thenounproject.com/sarah-jean/">Sarah-Jean</a> / Noun Project (CC BY)',
  maxZoom: 19,
}).addTo(map);

// ── helpers ───────────────────────────────────────────
const TC = {
  red:    { bg:'rgba(224,82,82,.88)',   bc:'rgba(255,140,140,.75)' },
  orange: { bg:'rgba(224,148,48,.88)',  bc:'rgba(255,200,100,.7)'  },
  green:  { bg:'rgba(61,184,132,.88)',  bc:'rgba(100,230,170,.7)'  },
};
const ORCA = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 90">
  <ellipse transform="matrix(-0.8359 0.5489 -0.5489 -0.8359 114.2132 30.2543)" cx="52.583" cy="32.202" rx="7.063" ry="3.263"/>
  <path d="M75.112,19.229c-1.954-1.162-5.459-10.526-40.16-2.536c0,0-19.251-6.505-14.427-2.82c0,0,6.482,4.241,4.606,7.792C22.59,26.475,3.175,44.961,19.55,70.89c0,0-2.924,3.899-1.754,8.579c0.905,3.621,3.095-1.285,4.038-5.587c0.268-1.221,0.435-2.391,0.443-3.306c0-0.025,0.002-0.053,0.002-0.077c0,0-1.784-3.869-1.729-9.266c-0.006,0.069-0.043,0.644,0.112,2.956c0.209,3.101-0.138,4.557-0.649,5.508c-0.512,0.948-3.286-4.048-2.559-5.862c0.607-1.522-0.366-3.497-0.366-3.497c1.581,0.974,3.456,0.881,3.461,0.881c0.062-5.702,2.183-13.104,10.628-19.459c-0.011,0.007-0.028,0.019-0.028,0.019c-4.826-3.582-8.651,2.697-8.651,2.697c-0.95,1.022-3.082,4.088-3.509,0.439c-1.097-9.358,9.333-13.315,13.232-9.431c2.463,2.453,4.093,2.996,4.093,2.996c-0.066,0.035-0.151,0.083-0.246,0.139c2.617-1.444,5.647-2.799,9.167-4.021l13.497-3.669c2.095-3.79-1.401-4.691-1.401-4.691c6.618-6.434,8.628-3.65,8.628-3.65s2.159-0.895,3.983-0.518c3.811,0.792,5.708,1.301,6.714,0.664C77.663,21.937,77.934,20.907,75.112,19.229z M65.56,20.008c-2.192,2.681-4.447,0.584-6.806,0c-2.359-0.585-5.258-1.303-3.333-1.754C55.421,18.254,68.057,16.955,65.56,20.008z"/>
  <path d="M21.755,26.455c0,0,8.566-8.51,8.639-5.115c0.073,3.396,0.073,3.762,4.972,1.423c0,0-6.186,4.562-7.752,2.588c-1.932-2.432-5.725,2.968-8.306,4.811L21.755,26.455z"/>
</svg>`;

function ageMins(t) { return (Date.now()-t)/60000; }
function getOp(t, maxH) {
  const m = ageMins(t), mx = maxH*60;
  if (m > mx) return 0;
  return Math.max(.12, 1-(m/mx)*.88);
}
function fmtT(t) {
  const m = ageMins(t);
  if (m < 60) return `Hace ${Math.round(m)} min`;
  if (m < 1440) return `Hace ${Math.round(m/60)} h`;
  return `Hace ${Math.round(m/1440)} días`;
}
function typeL(t) { return {contact:'Contacto físico',interaction:'Interacción',observation:'Observación'}[t]||t; }
function typeC(c) { return {red:'var(--red)',orange:'var(--orange)',green:'var(--green)'}[c]; }
function save() { try { localStorage.setItem('orcinus_v5', JSON.stringify(sightings)); } catch(e) {} }

// ── markers ───────────────────────────────────────────
let hoursWindow = 24;
let leafletMarkers = {};
let userMarker = null;

function makeIcon(s, op) {
  const c = TC[s.color];
  const badge = s.confirms > 0 ? `<div class="cbadge">${s.confirms}</div>` : '';
  return L.divIcon({
    className: '',
    html: `<div class="orca-pin" style="background:${c.bg};border-color:${c.bc};opacity:${op}">${ORCA}${badge}</div>`,
    iconSize: [40, 40],
    iconAnchor: [20, 20],
  });
}

function renderMarkers() {
  let active = 0;
  sightings.forEach(s => {
    const op = getOp(s.time, hoursWindow);
    if (op <= 0) {
      if (leafletMarkers[s.id]) { map.removeLayer(leafletMarkers[s.id]); delete leafletMarkers[s.id]; }
      return;
    }
    if (leafletMarkers[s.id]) {
      leafletMarkers[s.id].setIcon(makeIcon(s, op));
    } else {
      const m = L.marker([s.lat, s.lng], { icon: makeIcon(s, op) }).addTo(map);
      m.on('click', () => showPopup(s, m));
      leafletMarkers[s.id] = m;
    }
    if (op > 0.2) active++;
  });
  document.getElementById('sightCount').textContent = `${active} activos`;
}

// ── popup ─────────────────────────────────────────────
const popupEl = document.getElementById('popup');
const popupContent = document.getElementById('popupContent');
let openId = null;

function showPopup(s, marker) {
  openId = s.id;
  popupContent.innerHTML = `
    <div class="popup-type" style="color:${typeC(s.color)}">${typeL(s.type)}</div>
    <div class="popup-time">${fmtT(s.time)}</div>
    ${s.count > 1 ? `<div class="popup-count">${s.count} individuos</div>` : ''}
    ${s.notes ? `<div class="popup-notes">${s.notes}</div>` : ''}
    <div class="confirm-row">
      <button class="confirm-btn" onclick="doConfirm('${s.id}')">✓ Confirmar</button>
      <span class="confirm-count">${s.confirms} confirmaciones</span>
    </div>`;
  const pt = map.latLngToContainerPoint([s.lat, s.lng]);
  const mapRect = document.getElementById('map').getBoundingClientRect();
  let left = mapRect.left + pt.x - 95;
  let top  = mapRect.top  + pt.y - 170;
  if (left < 8) left = 8;
  if (left + 200 > window.innerWidth - 8) left = window.innerWidth - 208;
  if (top < 60) top = mapRect.top + pt.y + 30;
  popupEl.style.left = left + 'px';
  popupEl.style.top  = top  + 'px';
  popupEl.style.display = 'block';
}

window.closePopup = () => { popupEl.style.display = 'none'; openId = null; };
window.doConfirm = id => {
  const s = sightings.find(x => x.id === id); if (!s) return;
  s.confirms++; save(); closePopup(); renderMarkers(); showToast('Confirmación añadida ✓');
};

map.on('click', closePopup);
map.on('movestart', closePopup);

// ── slider ────────────────────────────────────────────
const timeRange = document.getElementById('timeRange');
const timeVal   = document.getElementById('timeVal');
function sliderToHours(v) { return 74 - parseInt(v); } // right(72)=2h "Ahora", left(1)=73h
function updateSliderLabel() {
  const h = sliderToHours(timeRange.value);
  timeVal.textContent = h <= 1 ? 'Ahora' : h + 'h';
}
timeRange.addEventListener('input', () => {
  hoursWindow = sliderToHours(timeRange.value);
  updateSliderLabel();
  renderMarkers();
});
hoursWindow = sliderToHours(timeRange.value); // init
updateSliderLabel();

// ── report modal ──────────────────────────────────────
let selType = null, cnt = 1;
const modalBg = document.getElementById('modalBg');
document.getElementById('reportBtn').addEventListener('click', () => { modalBg.style.display = 'flex'; });
document.getElementById('closeModal').addEventListener('click', () => { modalBg.style.display = 'none'; });
modalBg.addEventListener('click', e => { if (e.target === modalBg) modalBg.style.display = 'none'; });

document.querySelectorAll('.type-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.type-btn').forEach(b => b.className = 'type-btn');
    selType = btn.dataset.type;
    btn.classList.add('active-' + btn.dataset.color);
  });
});

const countVal = document.getElementById('countVal');
document.getElementById('countMinus').addEventListener('click', () => { if (cnt > 1) countVal.textContent = --cnt; });
document.getElementById('countPlus').addEventListener('click',  () => { if (cnt < 20) countVal.textContent = ++cnt; });

document.getElementById('submitBtn').addEventListener('click', () => {
  if (!selType) { showToast('Selecciona el tipo de interacción'); return; }
  const cm = { observation:'green', interaction:'orange', contact:'red' };
  const center = map.getCenter();
  const s = {
    id: 'u' + Date.now(),
    lat: center.lat + (Math.random()-.5)*.01,
    lng: center.lng + (Math.random()-.5)*.01,
    type: selType, color: cm[selType],
    time: Date.now(), count: cnt,
    notes: document.getElementById('notesInput').value.trim(),
    confirms: 0,
  };
  sightings.unshift(s); save(); renderMarkers();
  modalBg.style.display = 'none';
  selType = null; cnt = 1;
  document.querySelectorAll('.type-btn').forEach(b => b.className = 'type-btn');
  countVal.textContent = '1';
  document.getElementById('notesInput').value = '';
  map.setView([s.lat, s.lng], map.getZoom());
  showToast('¡Avistamiento añadido!');
});

// ── geolocation ───────────────────────────────────────
let userLat = 42.22, userLng = -8.81;
if (navigator.geolocation) {
  navigator.geolocation.watchPosition(pos => {
    userLat = pos.coords.latitude;
    userLng = pos.coords.longitude;
    const userIcon = L.divIcon({
      className: '',
      html: '<div class="user-pin"></div>',
      iconSize: [18, 18],
      iconAnchor: [9, 9],
    });
    if (!userMarker) {
      userMarker = L.marker([userLat, userLng], { icon: userIcon, zIndexOffset: -100 }).addTo(map);
    } else {
      userMarker.setLatLng([userLat, userLng]);
    }
  }, () => {}, { enableHighAccuracy: true });
}

// ── toast ─────────────────────────────────────────────
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block'; t.style.opacity = '1';
  setTimeout(() => { t.style.opacity = '0'; setTimeout(() => { t.style.display = 'none'; }, 300); }, 2200);
}

// ── init ──────────────────────────────────────────────
renderMarkers();
setInterval(renderMarkers, 60000);
</script>
