<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d1f2d">
<title>Orcinus</title>
<script>
// Aplicar el tema antes de pintar nada, para evitar un parpadeo
(function () {
  var t = null;
  try { t = localStorage.getItem('orcinus_theme'); } catch (e) {}
  if (t !== 'light' && t !== 'dark') t = (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', t);
})();
</script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── temas ─────────────────────────────────────────── */
:root, :root[data-theme="dark"] {
  --bg:#0d1f2d; --surface:#132333; --surface2:#1a2f42;
  --border:rgba(255,255,255,0.10); --fg:#e8f0f7; --fg2:rgba(232,240,247,.62); --fg3:rgba(232,240,247,.38);
  --accent:#3db8a0; --accent-dim:rgba(61,184,160,.18); --on-accent:#0d1f2d;
  --red:#e05252; --red-dim:rgba(224,82,82,.18);
  --orange:#e09430; --orange-dim:rgba(224,148,48,.18);
  --green:#3db884; --green-dim:rgba(61,184,132,.18);
  --scrim:rgba(13,31,45,.85); --header-bg:rgba(13,31,45,.95);
  --shadow:0 8px 32px rgba(0,0,0,.5);
  --tiles:saturate(0.85) brightness(0.92) hue-rotate(10deg);
  color-scheme:dark;
}
/* Claro: alto contraste, pensado para leerse a pleno sol */
:root[data-theme="light"] {
  --bg:#f3f6f8; --surface:#ffffff; --surface2:#e9eef2;
  --border:rgba(8,28,42,.22); --fg:#081c2a; --fg2:rgba(8,28,42,.80); --fg3:rgba(8,28,42,.62);
  --accent:#0a7563; --accent-dim:rgba(10,117,99,.14); --on-accent:#ffffff;
  --red:#c42b2b; --red-dim:rgba(196,43,43,.12);
  --orange:#b35900; --orange-dim:rgba(179,89,0,.12);
  --green:#17804f; --green-dim:rgba(23,128,79,.12);
  --scrim:rgba(8,28,42,.45); --header-bg:rgba(255,255,255,.97);
  --shadow:0 6px 24px rgba(8,28,42,.25);
  --tiles:none;
  color-scheme:light;
}
:root { --font:'DM Sans',system-ui,sans-serif; --mono:'DM Mono',monospace; --radius:14px; }

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:var(--font);background:var(--bg);color:var(--fg);overflow:hidden}
button{font-family:var(--font)}
#app{display:flex;flex-direction:column;height:100%;position:relative}

/* ── header ────────────────────────────────────────── */
#header{
  position:absolute;top:0;left:0;right:0;z-index:1000;
  display:flex;align-items:center;gap:8px;
  padding:12px 12px 12px 16px; padding-top:calc(12px + env(safe-area-inset-top,0px));
  background:linear-gradient(to bottom,var(--header-bg) 70%,transparent);
  pointer-events:none;
}
#header>*{pointer-events:auto}
.app-logo{width:36px;height:36px;background:var(--accent);border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.app-logo svg{width:28px;height:28px;fill:var(--on-accent)}
.app-name{font-size:18px;font-weight:600;letter-spacing:-.3px;flex:1;min-width:0}
.app-name span{color:var(--accent)}
.header-pill{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:6px 10px;font-size:12px;color:var(--fg2);font-family:var(--mono);display:flex;align-items:center;gap:6px;white-space:nowrap}
.header-pill .dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
.header-pill.offline .dot{background:var(--orange);animation:none}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.icon-btn{height:34px;min-width:34px;padding:0 8px;border-radius:17px;background:var(--surface);border:1px solid var(--border);color:var(--fg);display:flex;align-items:center;justify-content:center;gap:4px;cursor:pointer;font-size:12px;font-weight:600;font-family:var(--mono)}
.icon-btn svg{width:17px;height:17px}
.lang-wrap{position:relative}
#langMenu{position:absolute;top:40px;right:0;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);padding:6px;display:none;min-width:150px;z-index:1500}
#langMenu.open{display:block}
#langMenu button{display:flex;width:100%;justify-content:space-between;gap:12px;padding:10px 12px;border:none;background:none;color:var(--fg);font-size:14px;border-radius:8px;cursor:pointer;text-align:left}
#langMenu button:hover,#langMenu button.current{background:var(--surface2)}
#langMenu button span{font-family:var(--mono);font-size:11px;color:var(--fg3)}

/* ── mapa ──────────────────────────────────────────── */
#map{flex:1;position:relative;z-index:1}
.leaflet-tile-pane{filter:var(--tiles)}
.leaflet-container{background:var(--bg)}
.leaflet-top{top:calc(64px + env(safe-area-inset-top,0px))}
.leaflet-control-zoom,.locate-ctl{border:1px solid var(--border)!important;border-radius:8px!important;overflow:hidden;box-shadow:none!important}
.leaflet-control-zoom a,.locate-ctl a{background:var(--surface)!important;color:var(--fg)!important;border-color:var(--border)!important}
.leaflet-control-zoom a:hover,.locate-ctl a:hover{background:var(--surface2)!important}
.locate-ctl a{display:flex!important;align-items:center;justify-content:center;width:30px;height:30px;cursor:pointer}
.locate-ctl a svg{width:18px;height:18px}
.locate-ctl.on a{color:#4a90d9!important}
.locate-ctl.denied a{color:var(--orange)!important}
.locate-ctl.busy a svg{animation:spin 1.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── marcadores ────────────────────────────────────── */
.orca-pin{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2.5px solid transparent;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.4);position:relative}
.orca-pin svg{width:28px;height:28px}
.orca-pin .cbadge{position:absolute;top:-4px;right:-4px;background:#fff;color:#0d1f2d;border-radius:50%;width:17px;height:17px;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;font-family:var(--mono);box-shadow:0 0 0 1px rgba(0,0,0,.15)}
.user-pin{width:18px;height:18px;border-radius:50%;background:#4a90d9;border:3px solid #fff;box-shadow:0 0 0 6px rgba(74,144,217,.25)}
.place-pin{width:36px;height:46px;position:relative;cursor:grab}
.place-head{position:absolute;top:0;left:0;width:36px;height:36px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--accent);border:3px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center}
.place-head svg{width:22px;height:22px;transform:rotate(45deg);fill:var(--on-accent)}

/* ── popup de avistamiento ─────────────────────────── */
#popup{position:fixed;z-index:2000;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;min-width:200px;max-width:250px;box-shadow:var(--shadow);display:none}
.popup-type{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;margin-bottom:6px;padding-right:18px}
.popup-time{font-size:12px;color:var(--fg2);margin-bottom:8px;font-family:var(--mono)}
.popup-notes{font-size:13px;color:var(--fg2);margin-bottom:8px;overflow-wrap:anywhere}
.popup-count{font-size:12px;color:var(--fg3);margin-bottom:10px}
.confirm-row{display:flex;align-items:center;gap:8px}
.confirm-btn{flex:1;padding:8px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--fg2);font-size:12px;font-weight:600;cursor:pointer}
.confirm-btn:hover:not([disabled]){border-color:var(--accent);color:var(--accent)}
.confirm-btn[disabled]{opacity:.55;cursor:default}
.confirm-count{font-size:12px;color:var(--fg3);font-family:var(--mono);white-space:nowrap}
.popup-close{position:absolute;top:8px;right:8px;background:none;border:none;color:var(--fg3);font-size:14px;cursor:pointer;padding:4px}
.popup-own{font-size:11px;color:var(--fg3);font-style:italic}
.report-link{display:block;margin-top:10px;background:none;border:none;padding:0;color:var(--fg3);font-size:11px;text-decoration:underline;cursor:pointer;text-align:left}
.report-link.armed{color:var(--red)}

/* ── panel inferior ────────────────────────────────── */
#panel{position:absolute;bottom:0;left:0;right:0;z-index:1000;background:var(--surface);border-top:1px solid var(--border);border-radius:var(--radius) var(--radius) 0 0;padding:16px 16px calc(14px + env(safe-area-inset-bottom,0px))}
.panel-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 16px}
.slider-row{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.slider-label{font-size:11px;color:var(--fg3);font-family:var(--mono);white-space:nowrap;min-width:56px}
#timeRange{flex:1;-webkit-appearance:none;appearance:none;height:4px;background:var(--surface2);border-radius:2px;outline:none}
#timeRange::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--accent);cursor:pointer;box-shadow:0 0 0 3px var(--accent-dim)}
#timeRange::-moz-range-thumb{width:20px;height:20px;border:none;border-radius:50%;background:var(--accent);cursor:pointer}
.slider-val{font-size:12px;font-family:var(--mono);color:var(--accent);min-width:44px;text-align:right;font-weight:500}
.legend{display:flex;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.legend-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--fg2)}
.legend-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.primary-btn{width:100%;padding:14px;border-radius:12px;background:var(--accent);border:none;color:var(--on-accent);font-size:15px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.primary-btn:active{opacity:.85}
.primary-btn[disabled]{opacity:.6}
.secondary-btn{padding:12px 14px;border-radius:12px;background:var(--surface2);border:1px solid var(--border);color:var(--fg);font-size:14px;font-weight:600;cursor:pointer}
.credits{margin-top:10px;text-align:center;font-size:10px;line-height:1.5;color:var(--fg3)}
.credits a{color:var(--fg2);text-decoration:none}
.credits a:hover{text-decoration:underline}

/* ── barra para colocar el punto ───────────────────── */
#placeBar{position:absolute;bottom:0;left:0;right:0;z-index:1000;background:var(--surface);border-top:1px solid var(--border);border-radius:var(--radius) var(--radius) 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));display:none;box-shadow:var(--shadow)}
#placeBar p{font-size:14px;color:var(--fg);margin-bottom:6px;line-height:1.4}
#placeDist{font-size:12px;color:var(--fg2);font-family:var(--mono);margin-bottom:14px;min-height:16px}
.place-actions{display:flex;gap:8px}
.place-actions .primary-btn{flex:1}
body.placing #panel{display:none}
body.placing #placeBar{display:block}

/* ── hojas modales ─────────────────────────────────── */
.sheet-bg{position:fixed;inset:0;background:var(--scrim);z-index:3000;display:none;align-items:flex-end;padding:0 12px}
.sheet-bg.open{display:flex}
.sheet{background:var(--surface);border-radius:var(--radius) var(--radius) 0 0;border:1px solid var(--border);border-bottom:none;padding:20px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));width:100%;max-width:520px;margin:0 auto;max-height:92vh;overflow-y:auto;box-shadow:var(--shadow)}
.modal-title{font-size:17px;font-weight:600;margin-bottom:18px;display:flex;align-items:center;gap:8px}
.modal-orca{display:inline-flex;width:24px;height:24px;flex-shrink:0}
.modal-orca svg{width:24px;height:24px;fill:var(--accent)}
.modal-close{margin-left:auto;background:var(--surface2);border:1px solid var(--border);border-radius:50%;width:30px;height:30px;flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--fg2);font-size:15px}
.field-label{font-size:11px;font-weight:600;color:var(--fg3);text-transform:uppercase;letter-spacing:.7px;margin-bottom:8px}
.type-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px}
.type-btn{padding:12px 6px;border-radius:10px;border:1.5px solid var(--border);background:var(--surface2);color:var(--fg2);font-size:12px;font-weight:600;cursor:pointer;text-align:center;line-height:1.3}
.type-dot{display:block;width:18px;height:18px;border-radius:50%;margin:0 auto 6px}
.type-btn.active-red{border-color:var(--red);background:var(--red-dim);color:var(--fg)}
.type-btn.active-orange{border-color:var(--orange);background:var(--orange-dim);color:var(--fg)}
.type-btn.active-green{border-color:var(--green);background:var(--green-dim);color:var(--fg)}
.count-row{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.count-btn{width:40px;height:40px;border-radius:10px;border:1px solid var(--border);background:var(--surface2);color:var(--fg);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}
#countVal{font-size:22px;font-weight:600;font-family:var(--mono);min-width:30px;text-align:center}
.loc-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--surface2);margin-bottom:18px}
.loc-row svg{width:18px;height:18px;flex-shrink:0;color:var(--accent)}
.loc-row.warn{border-color:var(--orange)}
.loc-row.warn svg{color:var(--orange)}
.loc-text{flex:1;min-width:0;font-size:13px;line-height:1.35}
.loc-text small{display:block;color:var(--fg3);font-family:var(--mono);font-size:11px}
.loc-adjust{background:none;border:none;color:var(--accent);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;padding:4px}
.notes-input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--surface2);color:var(--fg);font-family:var(--font);font-size:15px;outline:none;resize:none;margin-bottom:16px}
.notes-input:focus{border-color:var(--accent)}
.notes-input::placeholder{color:var(--fg3)}
.help-intro{font-size:14px;line-height:1.5;color:var(--fg2);margin-bottom:14px}
.help-steps{padding-left:20px;margin-bottom:14px}
.help-steps li{font-size:14px;line-height:1.5;margin-bottom:8px;color:var(--fg)}
.help-after{font-size:13px;line-height:1.5;color:var(--fg3);margin-bottom:18px}

/* ── aviso flotante ────────────────────────────────── */
#toast{position:fixed;bottom:210px;left:50%;transform:translateX(-50%);max-width:calc(100% - 32px);width:max-content;text-align:center;background:var(--surface);border:1px solid var(--accent);border-radius:20px;padding:10px 18px;font-size:13px;font-weight:600;color:var(--accent);z-index:4000;transition:opacity .3s;pointer-events:none;display:none;box-shadow:var(--shadow)}
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <div class="app-logo" id="appLogo"></div>
    <span class="app-name">Orci<span>nus</span></span>
    <div class="header-pill"><span class="dot"></span><span id="sightCount"></span></div>
    <div class="lang-wrap">
      <button class="icon-btn" id="langBtn" data-i18n-title="language">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></svg>
        <span id="langCode">ES</span>
      </button>
      <div id="langMenu"></div>
    </div>
    <button class="icon-btn" id="themeBtn" data-i18n-title="theme"></button>
  </div>

  <div id="map"></div>

  <div id="panel">
    <div class="panel-handle"></div>
    <div class="slider-row">
      <span class="slider-label" data-i18n="history"></span>
      <input type="range" id="timeRange" min="1" max="72" value="72" step="1">
      <span class="slider-val" id="timeVal"></span>
    </div>
    <div class="legend">
      <div class="legend-item"><div class="legend-dot" style="background:var(--red)"></div><span data-i18n="contact"></span></div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--orange)"></div><span data-i18n="interaction"></span></div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--green)"></div><span data-i18n="observation"></span></div>
      <div class="legend-item" style="opacity:.5"><div class="legend-dot" style="background:#888"></div><span data-i18n="older"></span></div>
    </div>
    <button class="primary-btn" id="reportBtn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      <span data-i18n="reportBtn"></span>
    </button>
    <div class="credits">
      <span data-i18n="mapCredit"></span> &copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>
    </div>
  </div>

  <div id="placeBar">
    <p data-i18n="placeHint"></p>
    <div id="placeDist"></div>
    <div class="place-actions">
      <button class="secondary-btn" id="placeGps" data-i18n="useGps"></button>
      <button class="primary-btn" id="placeDone" data-i18n="done"></button>
    </div>
  </div>
</div>

<div id="popup">
  <button class="popup-close" onclick="closePopup()" data-i18n-title="close">✕</button>
  <div id="popupContent"></div>
</div>

<!-- formulario de reporte -->
<div class="sheet-bg" id="modalBg">
  <div class="sheet" id="modal">
    <div class="modal-title"><span class="modal-orca" id="modalOrca"></span><span data-i18n="newSighting"></span><button class="modal-close" id="closeModal" data-i18n-title="close">✕</button></div>
    <div class="field-label" data-i18n="typeLabel"></div>
    <div class="type-grid">
      <button class="type-btn" data-type="observation" data-color="green"><span class="type-dot" style="background:var(--green)"></span><span data-i18n="observation"></span></button>
      <button class="type-btn" data-type="interaction" data-color="orange"><span class="type-dot" style="background:var(--orange)"></span><span data-i18n="interaction"></span></button>
      <button class="type-btn" data-type="contact" data-color="red"><span class="type-dot" style="background:var(--red)"></span><span data-i18n="contact"></span></button>
    </div>
    <div class="field-label" data-i18n="countLabel"></div>
    <div class="count-row">
      <button class="count-btn" id="countMinus">−</button>
      <span id="countVal">1</span>
      <button class="count-btn" id="countPlus">+</button>
    </div>
    <div class="field-label" data-i18n="locationLabel"></div>
    <div class="loc-row" id="locRow">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.3-7-11.5A7 7 0 0 1 19 9.5C19 14.7 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
      <div class="loc-text" id="locText"></div>
      <button class="loc-adjust" id="locAdjust" data-i18n="adjust"></button>
    </div>
    <div class="field-label" data-i18n="notesLabel"></div>
    <textarea class="notes-input" id="notesInput" rows="2" maxlength="200" data-i18n-ph="notesPh"></textarea>
    <button class="primary-btn" id="submitBtn" data-i18n="submit"></button>
  </div>
</div>

<!-- ayuda cuando la ubicación está bloqueada -->
<div class="sheet-bg" id="helpBg">
  <div class="sheet">
    <div class="modal-title"><span data-i18n="helpTitle"></span><button class="modal-close" id="closeHelp" data-i18n-title="close">✕</button></div>
    <p class="help-intro" data-i18n="helpIntro"></p>
    <ol class="help-steps" id="helpSteps"></ol>
    <p class="help-after" data-i18n="helpAfter"></p>
    <button class="primary-btn" id="okHelp" data-i18n="gotIt"></button>
  </div>
</div>

<div id="toast"></div>

<script>
// ══ configuración ═════════════════════════════════════
// Si se vacían, la app funciona en modo demo con datos de ejemplo.
const SUPABASE_URL = 'https://xfktydldllfzqqpftjbn.supabase.co';
const SUPABASE_KEY = 'sb_publishable_7avcbtmPIMor47EsCztvnQ_694IJc81';   // clave pública (publishable) — NUNCA la secret/service_role
const sb = (SUPABASE_URL && SUPABASE_KEY && window.supabase)
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY)
  : null;

// ══ idiomas ═══════════════════════════════════════════
// Para añadir un idioma: copiar un bloque, traducirlo y añadirlo a LANGS.
const LANGS = { es:'Español', en:'English', pt:'Português', fr:'Français' };

function detectLang() {
  try { const s = localStorage.getItem('orcinus_lang'); if (I18N[s]) return s; } catch (e) {}
  for (const l of (navigator.languages || [navigator.language || 'en'])) {
    const code = String(l).slice(0, 2).toLowerCase();
    if (I18N[code]) return code;
  }
  return 'en';
}
let lang = detectLang();
function t(key, vars) {
  let s = (I18N[lang] && I18N[lang][key]) ?? I18N.en[key] ?? key;
  if (vars && typeof s === 'string') for (const k in vars) s = s.replace('{' + k + '}', vars[k]);
  return s;
}

function esc(str) { return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function ageMins(ts) { return (Date.now() - ts) / 60000; }
function getOp(ts, maxH) {
  const m = ageMins(ts), mx = maxH * 60;
  if (m > mx) return 0;
  return Math.max(.12, 1 - (m / mx) * .88);
}
function fmtT(ts) {
  const rtf = new Intl.RelativeTimeFormat(lang, { numeric:'always', style:'short' });
  const m = ageMins(ts);
  if (m < 60)   return rtf.format(-Math.max(1, Math.round(m)), 'minute');
  if (m < 1440) return rtf.format(-Math.round(m / 60), 'hour');
  return rtf.format(-Math.round(m / 1440), 'day');
}
function fmtDist(meters) {
  const nf = new Intl.NumberFormat(lang, { maximumFractionDigits: meters < 10000 ? 1 : 0 });
  return meters < 1000 ? Math.round(meters / 10) * 10 + ' m' : nf.format(meters / 1000) + ' km';
}
function typeL(type) { return { contact:t('contactFull'), interaction:t('interaction'), observation:t('observation') }[type] || type; }
function typeC(c) { return { red:'var(--red)', orange:'var(--orange)', green:'var(--green)' }[c]; }

// ══ backend ═══════════════════════════════════════════
let hasSourceCol = true;   // pasa a false si aún no se ejecutó la migración de la columna "source"
const colsSel = () => 'id,created_at,lat,lng,type,count,notes,confirms' + (hasSourceCol ? ',source' : '');
function fromRow(r) {
  return { id:r.id, lat:r.lat, lng:r.lng, type:r.type, color:TYPE_COLOR[r.type] || 'green',
           time:Date.parse(r.created_at), count:r.count, notes:r.notes || '', confirms:r.confirms, source:r.source || null };
}
function upsertLocal(s) {
  const i = sightings.findIndex(x => x.id === s.id);
  if (i >= 0) sightings[i] = s; else sightings.unshift(s);
}
function setOnline(ok) { document.querySelector('.header-pill').classList.toggle('offline', !ok); }
async function ensureSession() {
  const { data } = await sb.auth.getSession();
  if (data.session) return true;
  const { error } = await sb.auth.signInAnonymously();
  if (error) { console.error(error); showToast(t('tConnectErr')); return false; }
  return true;
}
async function fetchSightings() {
  const since = new Date(Date.now() - 74 * 3600000).toISOString();
  let { data, error } = await sb.from('sightings').select(colsSel())
    .gte('created_at', since).order('created_at', { ascending:false }).limit(1000);
  if (error && hasSourceCol && /source/.test(error.message || '')) {
    hasSourceCol = false;
    ({ data, error } = await sb.from('sightings').select(colsSel())
      .gte('created_at', since).order('created_at', { ascending:false }).limit(1000));
  }
  if (error) { console.error(error); setOnline(false); return; }
  setOnline(true);
  sightings = data.map(fromRow);
  renderMarkers();
}
function subscribeRealtime() {
  sb.channel('sightings-live')
    .on('postgres_changes', { event:'*', schema:'public', table:'sightings' }, p => {
      if (p.eventType === 'DELETE') sightings = sightings.filter(x => x.id !== p.old.id);
      else if (p.new && p.new.id) upsertLocal(fromRow(p.new));
      renderMarkers();
    })
    .subscribe(status => { if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') setOnline(false); });
}

// ══ marcadores ════════════════════════════════════════
let hoursWindow = 24;
const leafletMarkers = {};
function makeIcon(s, op) {
  const c = TC[s.color];
  const badge = s.confirms > 0 ? `<div class="cbadge">${s.confirms}</div>` : '';
  return L.divIcon({ className:'', iconSize:[40, 40], iconAnchor:[20, 20],
    html:`<div class="orca-pin" style="background:${c.bg};border-color:${c.bc};opacity:${op}">${ORCA}${badge}</div>` });
}
function renderMarkers() {
  let active = 0;
  const ids = new Set(sightings.map(s => s.id));
  Object.keys(leafletMarkers).forEach(id => { if (!ids.has(id)) { map.removeLayer(leafletMarkers[id]); delete leafletMarkers[id]; } });
  sightings.forEach(s => {
    const op = getOp(s.time, hoursWindow);
    if (op <= 0) { if (leafletMarkers[s.id]) { map.removeLayer(leafletMarkers[s.id]); delete leafletMarkers[s.id]; } return; }
    if (leafletMarkers[s.id]) leafletMarkers[s.id].setIcon(makeIcon(s, op));
    else {
      const m = L.marker([s.lat, s.lng], { icon:makeIcon(s, op) }).addTo(map);
      m.on('click', () => { if (placing) return; const cur = sightings.find(x => x.id === s.id); if (cur) showPopup(cur); });
      leafletMarkers[s.id] = m;
    }
    if (op > 0.2) active++;
  });
  document.getElementById('sightCount').textContent = t('active', { n:active });
}

      : `<div class="confirm-row">
           <button class="confirm-btn" onclick="doConfirm('${esc(s.id)}')" ${confirmed.has(s.id) ? 'disabled' : ''}>${esc(confirmed.has(s.id) ? t('confirmed') : t('confirm'))}</button>
           <span class="confirm-count">${esc(t('confShort', { n:s.confirms }))}</span>
         </div>
         ${sb && !reported.has(s.id) ? `<button class="report-link" onclick="doReport(this,'${esc(s.id)}')">${esc(t('reportAbuse'))}</button>` : ''}`}`;
  // colocar encima del marcador, dentro de la pantalla
  popupEl.style.display = 'block'; popupEl.style.left = '-9999px';
  const w = popupEl.offsetWidth, h = popupEl.offsetHeight;
  const pt = map.latLngToContainerPoint([s.lat, s.lng]);
  const r = document.getElementById('map').getBoundingClientRect();
  let left = r.left + pt.x - w / 2, top = r.top + pt.y - h - 28;
  left = Math.min(Math.max(8, left), window.innerWidth - w - 8);
  if (top < 70) top = r.top + pt.y + 28;
  popupEl.style.left = left + 'px'; popupEl.style.top = top + 'px';
}
window.closePopup = () => { popupEl.style.display = 'none'; openId = null; };
function refreshPopup() { if (openId) { const s = sightings.find(x => x.id === openId); s ? showPopup(s) : closePopup(); } }

window.doConfirm = async id => {
  const s = sightings.find(x => x.id === id); if (!s || confirmed.has(id) || mine.has(id)) return;
  closePopup();
  if (sb) {
    if (!(await ensureSession())) return;
    const { error } = await sb.from('confirmations').insert({ sighting_id:id });
    if (error && error.code !== '23505') { console.error(error); showToast(error.code === '42501' ? t('tCantConfirm') : t('tConfirmErr')); return; }
    if (error) { confirmed.add(id); saveSet('orcinus_confirmed', confirmed); showToast(t('tAlready')); return; }
  }
  s.confirms++; confirmed.add(id); saveSet('orcinus_confirmed', confirmed);
  save(); renderMarkers(); showToast(t('tConfirmed'));
};
window.doReport = async (btn, id) => {
  if (!btn.classList.contains('armed')) { btn.classList.add('armed'); btn.textContent = t('reportSure'); return; }
  closePopup();
  if (!(await ensureSession())) return;
  const { error } = await sb.from('reports').insert({ sighting_id:id });
  if (error && error.code !== '23505') { console.error(error); showToast(t('tReportErr')); return; }
  reported.add(id); saveSet('orcinus_reported', reported);
  showToast(t('tReported'));
};
map.on('movestart', closePopup);

// ══ deslizador de historial ═══════════════════════════
const timeRange = document.getElementById('timeRange');
const timeVal = document.getElementById('timeVal');
function sliderToHours(v) { return 74 - parseInt(v, 10); }   // derecha = 2 h, izquierda = 73 h
function updateSliderLabel() { const h = sliderToHours(timeRange.value); timeVal.textContent = h <= 1 ? t('now') : h + ' h'; }
timeRange.addEventListener('input', () => { hoursWindow = sliderToHours(timeRange.value); updateSliderLabel(); renderMarkers(); });
hoursWindow = sliderToHours(timeRange.value);

// ══ geolocalización ═══════════════════════════════════
// No se pide al abrir la app: solo al pulsar "mi ubicación" o "reportar".
let userLat = null, userLng = null, hasFix = false, userMarker = null;
let geoState = navigator.geolocation ? 'unknown' : 'unsupported';   // unknown | prompt | granted | denied | unsupported
let watchId = null, centerOnFix = false, geoRequestedAt = 0;
const geoListeners = [];

const LocateCtl = L.Control.extend({
  options:{ position:'topleft' },
  onAdd() {
    const div = L.DomUtil.create('div', 'leaflet-bar locate-ctl');
    div.innerHTML = `<a role="button" href="#">${ICON_LOCATE}</a>`;
    L.DomEvent.disableClickPropagation(div);
    L.DomEvent.on(div.firstChild, 'click', e => { L.DomEvent.preventDefault(e); onLocateClick(); });
    return div;
  },
});
const locateCtl = new LocateCtl().addTo(map);
function updateLocateCtl() {
  const el = locateCtl.getContainer();
  el.classList.toggle('on', hasFix);
  el.classList.toggle('denied', geoState === 'denied');
  el.classList.toggle('busy', watchId !== null && !hasFix && geoState !== 'denied');
  el.firstChild.title = t('locate'); el.firstChild.setAttribute('aria-label', t('locate'));
}
function onGeoSuccess(pos) {
  hasFix = true; geoState = 'granted';
  userLat = pos.coords.latitude; userLng = pos.coords.longitude;
  const icon = L.divIcon({ className:'', html:'<div class="user-pin"></div>', iconSize:[18, 18], iconAnchor:[9, 9] });
  if (!userMarker) userMarker = L.marker([userLat, userLng], { icon, zIndexOffset:-100, interactive:false }).addTo(map);
  else userMarker.setLatLng([userLat, userLng]);
  if (centerOnFix) { centerOnFix = false; map.setView([userLat, userLng], Math.max(map.getZoom(), 12)); }
  updateLocateCtl(); geoListeners.forEach(f => f());
}
function onGeoError(err) {
  if (err.code === 1) {                       // permiso denegado
    geoState = 'denied';
    if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
    // Si la respuesta es instantánea, el navegador ni preguntó: estaba bloqueado de antes → explicar cómo activarlo.
    // Si el usuario acaba de pulsar "Bloquear", no insistir.
    if (centerOnFix) { centerOnFix = false; if (Date.now() - geoRequestedAt < 800) showGeoHelp(); }
  } else if (centerOnFix && !hasFix) { centerOnFix = false; showToast(t('tGeoErr')); }
  updateLocateCtl(); geoListeners.forEach(f => f());
}
function startGeo() {
  if (!navigator.geolocation || watchId !== null || geoState === 'denied') return;
  geoRequestedAt = Date.now();
  watchId =navigator.geolocation.watchPosition(onGeoSuccess, onGeoError, { enableHighAccuracy:true, maximumAge:15000, timeout:30000 });
  updateLocateCtl();
}
function onLocateClick() {
  if (geoState === 'unsupported') { showToast(t('tGeoNo')); return; }
  if (geoState === 'denied') { showGeoHelp(); return; }
  if (hasFix) { map.setView([userLat, userLng], Math.max(map.getZoom(), 12)); return; }
  centerOnFix = true; startGeo();
}
// Saber el estado del permiso sin preguntar al usuario
if (navigator.permissions && navigator.geolocation) {
  navigator.permissions.query({ name:'geolocation' }).then(st => {
    const apply = () => {
      geoState = st.state;                      // granted | prompt | denied
      if (st.state === 'granted') startGeo();   // ya dio permiso antes: empezar sin preguntar
      updateLocateCtl(); geoListeners.forEach(f => f());
    };
    apply(); st.onchange = apply;
  }).catch(() => {});
}

// Ayuda para desbloquear la ubicación
const helpBg = document.getElementById('helpBg');
function isIOS() { return /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); }
function renderHelpSteps() { document.getElementById('helpSteps').innerHTML = t(isIOS() ? 'helpIos' : 'helpOther').map(s => `<li>${esc(s)}</li>`).join(''); }
function showGeoHelp() { renderHelpSteps(); helpBg.classList.add('open'); }
document.getElementById('closeHelp').onclick = document.getElementById('okHelp').onclick = () => helpBg.classList.remove('open');
helpBg.addEventListener('click', e => { if (e.target === helpBg) helpBg.classList.remove('open'); });

// ══ formulario de reporte ═════════════════════════════
let selType = null, cnt = 1;
let reportPos = null;          // { lat, lng, source:'gps'|'manual' }
let submitAfterPlace = false;
const modalBg = document.getElementById('modalBg');
const countVal = document.getElementById('countVal');
const submitBtn = document.getElementById('submitBtn');

function openForm() {
  closePopup();
  if (!reportPos || (reportPos.source === 'gps' && hasFix)) reportPos = hasFix ? { lat:userLat, lng:userLng, source:'gps' } : null;
  if (!hasFix && geoState !== 'denied') startGeo();      // aquí sí tiene sentido pedir la ubicación
  updateLocLine();
  modalBg.classList.add('open');
}
function closeForm() { modalBg.classList.remove('open'); }
function resetForm() {
  selType = null; cnt = 1; reportPos = null; submitAfterPlace = false;
  document.querySelectorAll('.type-btn').forEach(b => b.className = 'type-btn');
  countVal.textContent = '1';
  document.getElementById('notesInput').value = '';
}
function updateLocLine() {
  // Si llega el GPS mientras el formulario está abierto y no se marcó a mano, usarlo
  if (hasFix && (!reportPos || reportPos.source === 'gps')) reportPos = { lat:userLat, lng:userLng, source:'gps' };
  const row = document.getElementById('locRow'), txt = document.getElementById('locText');
  let main, sub = '';
  if (reportPos && reportPos.source === 'gps') { main = t('locGps'); sub = `${reportPos.lat.toFixed(4)}, ${reportPos.lng.toFixed(4)}`; }
  else if (reportPos) {
    main = t('locManual');
    sub = hasFix ? t('distance', { d:fmtDist(map.distance([userLat, userLng], [reportPos.lat, reportPos.lng])) })
                 : `${reportPos.lat.toFixed(4)}, ${reportPos.lng.toFixed(4)}`;
  }
  else if (watchId !== null && geoState !== 'denied') main = t('locWaiting');
  else main = t('locNone');
  row.classList.toggle('warn', !reportPos);
  txt.innerHTML = esc(main) + (sub ? `<small>${esc(sub)}</small>` : '');
}
geoListeners.push(() => { if (modalBg.classList.contains('open')) updateLocLine(); if (placing) updatePlaceBar(); });

document.getElementById('reportBtn').addEventListener('click', openForm);
document.getElementById('closeModal').addEventListener('click', closeForm);
modalBg.addEventListener('click', e => { if (e.target === modalBg) closeForm(); });
document.querySelectorAll('.type-btn').forEach(btn => btn.addEventListener('click', () => {
  document.querySelectorAll('.type-btn').forEach(b => b.className = 'type-btn');
  selType = btn.dataset.type; btn.classList.add('active-' + btn.dataset.color);
}));
document.getElementById('countMinus').addEventListener('click', () => { if (cnt > 1) countVal.textContent = --cnt; });
document.getElementById('countPlus').addEventListener('click',  () => { if (cnt < 50) countVal.textContent = ++cnt; });
document.getElementById('locAdjust').addEventListener('click', () => startPlacing(false));

// ── colocar el punto en el mapa ──
let placing = false, placeMarker = null;
const placeIcon = L.divIcon({ className:'', iconSize:[36, 46], iconAnchor:[18, 44], html:`<div class="place-pin"><div class="place-head">${ORCA}</div></div>` });
function startPlacing(thenSubmit) {
  submitAfterPlace = thenSubmit;
  closeForm(); closePopup();
  placing = true; document.body.classList.add('placing');
  const start = reportPos ? L.latLng(reportPos.lat, reportPos.lng) : (hasFix ? L.latLng(userLat, userLng) : map.getCenter());
  placeMarker = L.marker(start, { icon:placeIcon, draggable:true, autoPan:true, zIndexOffset:1000 }).addTo(map);
  placeMarker.on('drag', updatePlaceBar);
  map.panTo(start);
  updatePlaceBar();
}
function updatePlaceBar() {
  if (!placeMarker) return;
  const p = placeMarker.getLatLng();
  document.getElementById('placeDist').textContent = hasFix
    ? t('distance', { d:fmtDist(map.distance([userLat, userLng], p)) })
    : `${p.lat.toFixed(4)}, ${p.lng.toFixed(4)}`;
  document.getElementById('placeGps').style.display = hasFix ? '' : 'none';
}
function endPlacing(pos) {
  placing = false; document.body.classList.remove('placing');
  if (placeMarker) { map.removeLayer(placeMarker); placeMarker = null; }
  reportPos = pos;
  updateLocLine(); modalBg.classList.add('open');
  if (submitAfterPlace) { submitAfterPlace = false; doSubmit(); }
}
map.on('click', e => { if (placing && placeMarker) { placeMarker.setLatLng(e.latlng); updatePlaceBar(); } else closePopup(); });
document.getElementById('placeDone').addEventListener('click', () => {
  const p = placeMarker.getLatLng();
  // Si apenas se movió del GPS (menos de 15 m), se sigue considerando GPS
  const isGps = hasFix && map.distance([userLat, userLng], p) < 15;
  endPlacing({ lat:p.lat, lng:p.lng, source: isGps ? 'gps' : 'manual' });
});
document.getElementById('placeGps').addEventListener('click', () => { if (hasFix) endPlacing({ lat:userLat, lng:userLng, source:'gps' }); });

// ── envío ──
async function doSubmit() {
  if (!selType) { showToast(t('tPickType')); return; }
  if (!reportPos) { startPlacing(true); return; }    // sin GPS ni punto marcado: pedir que lo marque
  const payload = {
    lat:+reportPos.lat.toFixed(5), lng:+reportPos.lng.toFixed(5), type:selType, count:cnt,
    notes:document.getElementById('notesInput').value.trim().slice(0, 200),
  };
  if (hasSourceCol) payload.source = reportPos.source;
  let s;
  if (sb) {
    submitBtn.disabled = true; submitBtn.textContent = t('sending');
    let res = null;
    if (await ensureSession()) {
      res = await sb.from('sightings').insert(payload).select(colsSel()).single();
      if (res.error && hasSourceCol && /source/.test(res.error.message || '')) {   // migración aún no aplicada
        hasSourceCol = false; delete payload.source;
        res = await sb.from('sightings').insert(payload).select(colsSel()).single();
      }
    }
    submitBtn.disabled = false; submitBtn.textContent = t('submit');
    if (!res) return;
    if (res.error) { console.error(res.error); showToast(/rate_limit/.test(res.error.message) ? t('tRate') : t('tSendErr')); return; }
    s = fromRow(res.data);
  } else {
    s = { id:'u' + Date.now(), ...payload, source:reportPos.source, color:TYPE_COLOR[selType], time:Date.now(), confirms:0 };
  }
  mine.add(s.id); saveSet('orcinus_mine', mine);
  upsertLocal(s); save(); renderMarkers();
  closeForm(); resetForm();
  map.setView([s.lat, s.lng], map.getZoom());
  showToast(t('tAdded'));
}
submitBtn.addEventListener('click', doSubmit);

// ══ tema ══════════════════════════════════════════════
const themeBtn = document.getElementById('themeBtn');
function currentTheme() { return document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark'; }
function applyTheme(th, persist) {
  document.documentElement.setAttribute('data-theme', th);
  document.querySelector('meta[name="theme-color"]').setAttribute('content', th === 'light' ? '#ffffff' : '#0d1f2d');
  themeBtn.innerHTML = th === 'light' ? ICON_MOON : ICON_SUN;   // muestra a qué tema se cambia
  if (persist) { try { localStorage.setItem('orcinus_theme', th); } catch (e) {} }
}
themeBtn.addEventListener('click', () => applyTheme(currentTheme() === 'light' ? 'dark' : 'light', true));
if (window.matchMedia) matchMedia('(prefers-color-scheme: light)').addEventListener?.('change', e => {
  let saved = null; try { saved = localStorage.getItem('orcinus_theme'); } catch (_) {}
  if (!saved) applyTheme(e.matches ? 'light' : 'dark', false);   // seguir al sistema mientras no se elija a mano
});
applyTheme(currentTheme(), false);

// ══ idioma ════════════════════════════════════════════
const langMenu = document.getElementById('langMenu');
function applyLang(code, persist) {
  lang = I18N[code] ? code : 'en';
  if (persist) { try { localStorage.setItem('orcinus_lang', lang); } catch (e) {} }
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll('[data-i18n-ph]').forEach(el => el.placeholder = t(el.dataset.i18nPh));
  document.querySelectorAll('[data-i18n-title]').forEach(el => { el.title = t(el.dataset.i18nTitle); el.setAttribute('aria-label', t(el.dataset.i18nTitle)); });
  document.getElementById('langCode').textContent = lang.toUpperCase();
  langMenu.innerHTML = Object.entries(LANGS).map(([c, name]) =>
    `<button data-lang="${c}" class="${c === lang ? 'current' : ''}">${name}<span>${c.toUpperCase()}</span></button>`).join('');
  if (submitBtn.disabled) submitBtn.textContent = t('sending');
  updateSliderLabel(); renderMarkers(); refreshPopup(); updateLocateCtl();
  if (modalBg.classList.contains('open')) updateLocLine();
  if (helpBg.classList.contains('open')) renderHelpSteps();
  if (placing) updatePlaceBar();
}
document.getElementById('langBtn').addEventListener('click', e => { e.stopPropagation(); langMenu.classList.toggle('open'); });
langMenu.addEventListener('click', e => { const b = e.target.closest('button[data-lang]'); if (b) { applyLang(b.dataset.lang, true); langMenu.classList.remove('open'); } });
document.addEventListener('click', e => { if (!e.target.closest('.lang-wrap')) langMenu.classList.remove('open'); });

// ══ aviso flotante ════════════════════════════════════
let toastTimer = null;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.style.display = 'block'; el.style.opacity = '1';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.style.opacity = '0'; setTimeout(() => { el.style.display = 'none'; }, 300); }, 2600);
}

// ══ arranque ══════════════════════════════════════════
applyLang(lang, false);
setInterval(() => { renderMarkers(); refreshPopup(); }, 60000);   // actualizar transparencias y "hace X min"
if (sb) {
  fetchSightings();
  subscribeRealtime();
  setInterval(fetchSightings, 120000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) fetchSightings(); });
}
</script>
</body>
