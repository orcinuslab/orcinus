<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d1f2d">
<meta name="robots" content="noindex, nofollow"><!-- quitar al publicar -->
<title>Orcinus</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Orcinus">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script>
// Aplicar el tema antes de pintar nada, para evitar un parpadeo
(function () {
  var t = null;
  try { t = localStorage.getItem('orcinus_theme'); } catch (e) {}
  if (t !== 'light' && t !== 'dark') t = (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', t);
})();
</script>
<!-- Librerías y fuentes alojadas aquí: la web no conecta con terceros salvo el mapa (OSM) y Supabase -->
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="vendor/fonts.css">
<script src="vendor/leaflet.js"></script>
<script src="vendor/supabase.js"></script>
<style>
/* ── temas ─────────────────────────────────────────── */
:root, :root[data-theme="dark"] {
  --bg:#0d1f2d; --surface:#132333; --surface2:#1a2f42;
  --border:rgba(255,255,255,0.10); --fg:#e8f0f7; --fg2:rgba(232,240,247,.62); --fg3:rgba(232,240,247,.38);
  --accent:#3db8a0; --accent-dim:rgba(61,184,160,.18); --on-accent:#0d1f2d;
  --red:#e05252; --red-dim:rgba(224,82,82,.18);
  --orange:#e09430; --orange-dim:rgba(224,148,48,.18);
  --green:#3db884; --green-dim:rgba(61,184,132,.18);
  --scrim:rgba(13,31,45,.85); --header-bg:rgba(13,31,45,.95);
  --shadow:0 8px 32px rgba(0,0,0,.5);
  --tiles:saturate(0.85) brightness(0.92) hue-rotate(10deg);
  color-scheme:dark;
}
/* Claro: alto contraste, pensado para leerse a pleno sol */
:root[data-theme="light"] {
  --bg:#f3f6f8; --surface:#ffffff; --surface2:#e9eef2;
  --border:rgba(8,28,42,.22); --fg:#081c2a; --fg2:rgba(8,28,42,.80); --fg3:rgba(8,28,42,.62);
  --accent:#0a7563; --accent-dim:rgba(10,117,99,.14); --on-accent:#ffffff;
  --red:#c42b2b; --red-dim:rgba(196,43,43,.12);
  --orange:#b35900; --orange-dim:rgba(179,89,0,.12);
  --green:#17804f; --green-dim:rgba(23,128,79,.12);
  --scrim:rgba(8,28,42,.45); --header-bg:rgba(255,255,255,.97);
  --shadow:0 6px 24px rgba(8,28,42,.25);
  --tiles:none;
  color-scheme:light;
}
:root { --font:'DM Sans',system-ui,sans-serif; --mono:'DM Mono',monospace; --radius:14px; }

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:var(--font);background:var(--bg);color:var(--fg);overflow:hidden}
button{font-family:var(--font)}
#app{display:flex;flex-direction:column;height:100%;position:relative}

/* ── header ────────────────────────────────────────── */
#header{
  position:absolute;top:0;left:0;right:0;z-index:1000;
  display:flex;align-items:center;gap:8px;
  padding:12px 12px 12px 16px; padding-top:calc(12px + env(safe-area-inset-top,0px));
  background:linear-gradient(to bottom,var(--header-bg) 70%,transparent);
  pointer-events:none;
}
#header>*{pointer-events:auto}
.app-logo{width:36px;height:36px;background:linear-gradient(160deg,#1d4460 0%,#0d1f2d 62%,#081520 100%);border:1px solid rgba(255,255,255,.14);border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.app-logo svg{width:26px;height:26px;fill:#fff}
.app-name{font-size:18px;font-weight:600;letter-spacing:-.3px;flex:1;min-width:0}
.app-name span{color:var(--accent)}
.header-pill{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:6px 10px;font-size:12px;color:var(--fg2);font-family:var(--mono);display:flex;align-items:center;gap:6px;white-space:nowrap}
.header-pill .dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
.header-pill.offline .dot{background:var(--orange);animation:none}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.icon-btn{height:34px;min-width:34px;padding:0 8px;border-radius:17px;background:var(--surface);border:1px solid var(--border);color:var(--fg);display:flex;align-items:center;justify-content:center;gap:4px;cursor:pointer;font-size:12px;font-weight:600;font-family:var(--mono)}
.icon-btn svg{width:17px;height:17px}
.lang-wrap{position:relative}
#langMenu{position:absolute;top:40px;right:0;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);padding:6px;display:none;min-width:150px;z-index:1500}
#langMenu.open{display:block}
#langMenu button{display:flex;width:100%;justify-content:space-between;gap:12px;padding:10px 12px;border:none;background:none;color:var(--fg);font-size:14px;border-radius:8px;cursor:pointer;text-align:left}
#langMenu button:hover,#langMenu button.current{background:var(--surface2)}
#langMenu button span{font-family:var(--mono);font-size:11px;color:var(--fg3)}

/* ── mapa ──────────────────────────────────────────── */
#map{flex:1;position:relative;z-index:1}
.leaflet-tile-pane{filter:var(--tiles)}
.leaflet-container{background:var(--bg)}
.leaflet-top{top:calc(64px + env(safe-area-inset-top,0px))}
.leaflet-control-zoom,.locate-ctl{border:1px solid var(--border)!important;border-radius:8px!important;overflow:hidden;box-shadow:none!important}
.leaflet-control-zoom a,.locate-ctl a{background:var(--surface)!important;color:var(--fg)!important;border-color:var(--border)!important}
.leaflet-control-zoom a:hover,.locate-ctl a:hover{background:var(--surface2)!important}
.locate-ctl a{display:flex!important;align-items:center;justify-content:center;width:30px;height:30px;cursor:pointer}
.locate-ctl a svg{width:18px;height:18px}
.locate-ctl.on a{color:#4a90d9!important}
.locate-ctl.denied a{color:var(--orange)!important}
.locate-ctl.busy a svg{animation:spin 1.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── marcadores ────────────────────────────────────── */
.orca-pin{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2.5px solid transparent;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.4);position:relative}
.orca-pin svg{width:28px;height:28px}
.orca-pin .cbadge{position:absolute;top:-4px;right:-4px;background:#fff;color:#0d1f2d;border-radius:50%;width:17px;height:17px;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;font-family:var(--mono);box-shadow:0 0 0 1px rgba(0,0,0,.15)}
.user-pin{width:18px;height:18px;border-radius:50%;background:#4a90d9;border:3px solid #fff;box-shadow:0 0 0 6px rgba(74,144,217,.25)}
.place-pin{width:36px;height:46px;position:relative;cursor:grab}
.place-head{position:absolute;top:0;left:0;width:36px;height:36px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--accent);border:3px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center}
.place-head svg{width:22px;height:22px;transform:rotate(45deg);fill:var(--on-accent)}

/* ── popup de avistamiento ─────────────────────────── */
#popup{position:fixed;z-index:2000;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;min-width:200px;max-width:250px;box-shadow:var(--shadow);display:none}
.popup-type{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;margin-bottom:6px;padding-right:18px}
.popup-time{font-size:12px;color:var(--fg2);margin-bottom:8px;font-family:var(--mono)}
.popup-nav{font-size:12px;color:var(--accent);margin:-4px 0 8px;font-family:var(--mono);font-weight:500}
.proto-btn{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:14px;border:1px solid var(--orange);background:var(--orange-dim);color:var(--fg);font-size:12px;font-weight:600;cursor:pointer}
.proto-btn svg{width:14px;height:14px;color:var(--orange)}
.proto-banner{display:none;align-items:center;gap:8px;width:100%;margin:-8px 0 16px;padding:10px 12px;border-radius:10px;border:1px solid var(--orange);background:var(--orange-dim);color:var(--fg);font-size:13px;font-weight:600;cursor:pointer;text-align:left}
.proto-banner.show{display:flex}
.proto-banner svg{width:18px;height:18px;flex-shrink:0;color:var(--orange)}
.proto-banner span{flex:1}
.proto-intro{font-size:13px;line-height:1.45;color:var(--fg3);margin:-8px 0 14px}
.proto-h{font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--accent);margin:14px 0 6px}
.proto-list{padding-left:20px;margin:0}
.proto-list li{font-size:14px;line-height:1.5;color:var(--fg);margin-bottom:6px}
.proto-sos{margin:16px 0 10px;padding:12px;border-radius:12px;background:var(--red-dim);border:1px solid var(--red);font-size:14px;line-height:1.6;color:var(--fg)}
.proto-sos strong{display:block;color:var(--red);font-size:12px;letter-spacing:.6px;text-transform:uppercase;margin-bottom:2px}
.proto-sos a{color:var(--fg);font-weight:700;white-space:nowrap}
.proto-note{font-size:12px;line-height:1.5;color:var(--fg3);margin-bottom:10px}
.proto-src{display:block;font-size:13px;color:var(--accent);margin-bottom:16px}
.panel-chips{display:flex;gap:8px;margin:-6px 0 14px;flex-wrap:wrap}
.panel-chips>button{white-space:nowrap}
.hist-btn{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:14px;border:1px solid var(--border);background:var(--surface2);color:var(--fg);font-size:12px;font-weight:600;cursor:pointer}
.hist-btn svg{width:14px;height:14px;color:var(--accent)}
.hist-sub{font-size:13px;color:var(--fg3);margin:-10px 0 12px;font-family:var(--mono)}
.hist-list{list-style:none;margin:0 0 12px;padding:0}
.hist-item{display:flex;gap:10px;align-items:flex-start;width:100%;padding:11px 4px;border:none;border-bottom:1px solid var(--border);background:none;color:var(--fg);text-align:left;cursor:pointer;font-family:var(--font)}
.hist-item:hover{background:var(--surface2)}
.hist-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;margin-top:4px}
.hist-main{flex:1;min-width:0}
.hist-top{display:flex;justify-content:space-between;gap:8px;font-size:14px;font-weight:600}
.hist-date{font-family:var(--mono);font-size:12px;color:var(--fg2);font-weight:500;white-space:nowrap}
.hist-meta{font-size:12px;color:var(--fg3);margin-top:2px}
.hist-notes{font-size:13px;color:var(--fg2);margin-top:3px;overflow-wrap:anywhere}
.hist-status{font-size:12px;margin-top:3px;font-weight:600;color:var(--fg3)}
.hist-status.on{color:var(--accent)}
.hist-status.pend{color:var(--orange)}
.hist-empty{font-size:14px;color:var(--fg2);padding:18px 0;text-align:center}
.hist-note{font-size:12px;color:var(--fg3);margin-bottom:14px}
.popup-notes{font-size:13px;color:var(--fg2);margin-bottom:8px;overflow-wrap:anywhere}
.popup-count{font-size:12px;color:var(--fg3);margin-bottom:10px}
.confirm-row{display:flex;align-items:center;gap:8px}
.confirm-btn{flex:1;padding:8px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--fg2);font-size:12px;font-weight:600;cursor:pointer}
.confirm-btn:hover:not([disabled]){border-color:var(--accent);color:var(--accent)}
.confirm-btn[disabled]{opacity:.55;cursor:default}
.confirm-count{font-size:12px;color:var(--fg3);font-family:var(--mono);white-space:nowrap}
.popup-close{position:absolute;top:8px;right:8px;background:none;border:none;color:var(--fg3);font-size:14px;cursor:pointer;padding:4px}
.popup-own{font-size:11px;color:var(--fg3);font-style:italic}
.report-link{display:block;margin-top:10px;background:none;border:none;padding:0;color:var(--fg3);font-size:11px;text-decoration:underline;cursor:pointer;text-align:left}
.report-link.armed{color:var(--red)}

/* ── panel inferior ────────────────────────────────── */
#panel{position:absolute;bottom:0;left:0;right:0;z-index:1000;background:var(--surface);border-top:1px solid var(--border);border-radius:var(--radius) var(--radius) 0 0;padding:16px 16px calc(14px + env(safe-area-inset-bottom,0px))}
.panel-handle{width:40px;height:5px;background:var(--fg3);opacity:.6;border-radius:3px;margin:0 auto}
#panel{transition:transform .28s cubic-bezier(.2,.8,.2,1);will-change:transform}
.panel-grab{margin:-16px -16px 10px;padding:12px 0 10px;cursor:grab;touch-action:none;-webkit-user-select:none;user-select:none;border-radius:var(--radius) var(--radius) 0 0}
.panel-grab:active{cursor:grabbing}
.panel-grab:focus-visible{outline:2px solid var(--accent);outline-offset:-4px}
#fab{position:absolute;right:16px;bottom:calc(46px + env(safe-area-inset-bottom,0px));z-index:1001;width:56px;height:56px;border-radius:50%;border:none;background:var(--accent);color:var(--on-accent);box-shadow:var(--shadow);display:none;align-items:center;justify-content:center;cursor:pointer}
#fab svg{width:24px;height:24px}
body.panel-collapsed #fab{display:flex}
body.placing #fab{display:none}
#osmMini{position:absolute;left:8px;bottom:calc(34px + env(safe-area-inset-bottom,0px));z-index:999;font-size:10px;padding:2px 6px;border-radius:6px;background:var(--surface);color:var(--fg3);opacity:.85;display:none}
#osmMini a{color:var(--fg2);text-decoration:none}
body.panel-collapsed #osmMini{display:block}
body.placing #osmMini{display:none}
.slider-row{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.slider-label{font-size:11px;color:var(--fg3);font-family:var(--mono);white-space:nowrap;min-width:56px}
#timeRange{flex:1;-webkit-appearance:none;appearance:none;height:4px;background:var(--surface2);border-radius:2px;outline:none}
#timeRange::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--accent);cursor:pointer;box-shadow:0 0 0 3px var(--accent-dim)}
#timeRange::-moz-range-thumb{width:20px;height:20px;border:none;border-radius:50%;background:var(--accent);cursor:pointer}
.slider-val{font-size:12px;font-family:var(--mono);color:var(--accent);min-width:44px;text-align:right;font-weight:500}
.legend{display:flex;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.legend-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--fg2)}
.legend-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.primary-btn{width:100%;padding:14px;border-radius:12px;background:var(--accent);border:none;color:var(--on-accent);font-size:15px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.primary-btn:active{opacity:.85}
.primary-btn[disabled]{opacity:.6}
.secondary-btn{padding:12px 14px;border-radius:12px;background:var(--surface2);border:1px solid var(--border);color:var(--fg);font-size:14px;font-weight:600;cursor:pointer}
.credits{margin-top:10px;text-align:center;font-size:10px;line-height:1.5;color:var(--fg3)}
.credits a{color:var(--fg2);text-decoration:none}
.credits a:hover{text-decoration:underline}
.install-card{display:none;align-items:center;gap:12px;padding:12px;margin-bottom:12px;border-radius:12px;background:var(--accent-dim);border:1px solid var(--accent)}
.install-card.show{display:flex}
.install-icon{width:40px;height:40px;border-radius:10px;background:var(--accent);flex-shrink:0;display:flex;align-items:center;justify-content:center}
.install-icon svg{width:30px;height:30px;fill:var(--on-accent)}
.install-text{flex:1;min-width:0;line-height:1.3}
.install-text strong{display:block;font-size:14px;color:var(--fg)}
.install-text span{display:block;font-size:12px;color:var(--fg2)}
.install-go{padding:9px 14px;border-radius:10px;border:none;background:var(--accent);color:var(--on-accent);font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.install-x{background:none;border:none;color:var(--fg3);font-size:16px;cursor:pointer;padding:4px;margin-left:-4px;align-self:flex-start}
.credits-legal{margin-top:2px}
.credits-legal a,.credit-btn{color:var(--fg3);text-decoration:underline;font-size:10px}
.credit-btn{background:none;border:none;padding:0;cursor:pointer;font-family:var(--font)}
.form-legal{margin-top:10px;font-size:11px;line-height:1.45;color:var(--fg3);text-align:center}
.form-legal a{color:var(--fg2)}
.sheet-text{font-size:14px;line-height:1.5;color:var(--fg2);margin-bottom:12px}
.sheet-actions{display:flex;gap:8px;margin-top:6px}
.sheet-actions>*{flex:1}
.danger-btn{padding:12px 14px;border-radius:12px;background:var(--red);border:none;color:#fff;font-size:14px;font-weight:700;cursor:pointer}
.danger-btn[disabled]{opacity:.6}
#installLink{display:none;background:none;border:none;color:var(--accent);font-size:11px;font-weight:600;cursor:pointer;padding:0 6px 0 0}
#installLink.show{display:inline}
.queue-badge{color:var(--orange);font-weight:600}
.orca-pin.pending{border-style:dashed!important;border-color:#fff!important;filter:saturate(.6)}
.popup-pending{font-size:12px;color:var(--orange);font-weight:600}

/* ── barra para colocar el punto ───────────────────── */
#placeBar{position:absolute;bottom:0;left:0;right:0;z-index:1000;background:var(--surface);border-top:1px solid var(--border);border-radius:var(--radius) var(--radius) 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));display:none;box-shadow:var(--shadow)}
#placeBar p{font-size:14px;color:var(--fg);margin-bottom:6px;line-height:1.4}
#placeDist{font-size:12px;color:var(--fg2);font-family:var(--mono);margin-bottom:14px;min-height:16px}
.place-actions{display:flex;gap:8px}
.place-actions .primary-btn{flex:1}
body.placing #panel{display:none}
body.placing #placeBar{display:block}

/* ── hojas modales ─────────────────────────────────── */
.sheet-bg{position:fixed;inset:0;background:var(--scrim);z-index:3000;display:none;align-items:flex-end;padding:0 12px}
.sheet-bg.open{display:flex}
.sheet{background:var(--surface);border-radius:var(--radius) var(--radius) 0 0;border:1px solid var(--border);border-bottom:none;padding:20px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));width:100%;max-width:520px;margin:0 auto;max-height:92vh;overflow-y:auto;box-shadow:var(--shadow)}
.modal-title{font-size:17px;font-weight:600;margin-bottom:18px;display:flex;align-items:center;gap:8px}
.modal-orca{display:inline-flex;width:24px;height:24px;flex-shrink:0}
.modal-orca svg{width:24px;height:24px;fill:var(--accent)}
.modal-close{margin-left:auto;background:var(--surface2);border:1px solid var(--border);border-radius:50%;width:30px;height:30px;flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--fg2);font-size:15px}
.field-label{font-size:11px;font-weight:600;color:var(--fg3);text-transform:uppercase;letter-spacing:.7px;margin-bottom:8px}
.type-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px}
.type-btn{padding:12px 6px;border-radius:10px;border:1.5px solid var(--border);background:var(--surface2);color:var(--fg2);font-size:12px;font-weight:600;cursor:pointer;text-align:center;line-height:1.3}
.type-dot{display:block;width:18px;height:18px;border-radius:50%;margin:0 auto 6px}
.type-btn.active-red{border-color:var(--red);background:var(--red-dim);color:var(--fg)}
.type-btn.active-orange{border-color:var(--orange);background:var(--orange-dim);color:var(--fg)}
.type-btn.active-green{border-color:var(--green);background:var(--green-dim);color:var(--fg)}
.count-row{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.count-btn{width:40px;height:40px;border-radius:10px;border:1px solid var(--border);background:var(--surface2);color:var(--fg);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}
#countVal{font-size:22px;font-weight:600;font-family:var(--mono);min-width:30px;text-align:center}
.loc-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--surface2);margin-bottom:18px}
.loc-row svg{width:18px;height:18px;flex-shrink:0;color:var(--accent)}
.loc-row.warn{border-color:var(--orange)}
.loc-row.warn svg{color:var(--orange)}
.loc-text{flex:1;min-width:0;font-size:13px;line-height:1.35}
.loc-text small{display:block;color:var(--fg3);font-family:var(--mono);font-size:11px}
.loc-adjust{background:none;border:none;color:var(--accent);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;padding:4px}
.notes-input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--surface2);color:var(--fg);font-family:var(--font);font-size:15px;outline:none;resize:none;margin-bottom:16px}
.notes-input:focus{border-color:var(--accent)}
.notes-input::placeholder{color:var(--fg3)}
.help-intro{font-size:14px;line-height:1.5;color:var(--fg2);margin-bottom:14px}
.help-steps{padding-left:20px;margin-bottom:14px}
.help-steps li{font-size:14px;line-height:1.5;margin-bottom:8px;color:var(--fg)}
.help-after{font-size:13px;line-height:1.5;color:var(--fg3);margin-bottom:18px}

/* ── aviso flotante ────────────────────────────────── */
#toast{position:fixed;bottom:210px;left:50%;transform:translateX(-50%);max-width:calc(100% - 32px);width:max-content;text-align:center;background:var(--surface);border:1px solid var(--accent);border-radius:20px;padding:10px 18px;font-size:13px;font-weight:600;color:var(--accent);z-index:4000;transition:opacity .3s;pointer-events:none;display:none;box-shadow:var(--shadow)}
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <div class="app-logo" id="appLogo"></div>
    <span class="app-name">Orci<span>nus</span></span>
    <div class="header-pill"><span class="dot"></span><span id="sightCount"></span></div>
    <div class="lang-wrap">
      <button class="icon-btn" id="langBtn" data-i18n-title="language">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></svg>
        <span id="langCode">ES</span>
      </button>
      <div id="langMenu"></div>
    </div>
    <button class="icon-btn" id="themeBtn" data-i18n-title="theme"></button>
  </div>

  <div id="map"></div>

  <div id="panel">
    <div class="panel-grab" id="panelGrab" role="button" tabindex="0" aria-expanded="true" data-i18n-title="panelToggle"><div class="panel-handle"></div></div>
    <div class="slider-row">
      <span class="slider-label" data-i18n="history"></span>
      <input type="range" id="timeRange" min="1" max="72" value="72" step="1">
      <span class="slider-val" id="timeVal"></span>
    </div>
    <div class="legend">
      <div class="legend-item"><div class="legend-dot" style="background:var(--red)"></div><span data-i18n="contact"></span></div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--orange)"></div><span data-i18n="interaction"></span></div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--green)"></div><span data-i18n="observation"></span></div>
      <div class="legend-item" style="opacity:.5"><div class="legend-dot" style="background:#888"></div><span data-i18n="older"></span></div>
    </div>
    <div class="panel-chips">
      <button class="hist-btn" id="histBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/></svg><span data-i18n="myHistory"></span></button>
      <button class="proto-btn" id="protoBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><path d="M5.6 5.6l3.6 3.6M14.8 14.8l3.6 3.6M18.4 5.6l-3.6 3.6M9.2 14.8l-3.6 3.6"/></svg><span data-i18n="protoBtn"></span></button>
    </div>
    <div class="install-card" id="installCard">
      <div class="install-icon" id="installIcon"></div>
      <div class="install-text"><strong data-i18n="installTitle"></strong><span data-i18n="installSub"></span></div>
      <button class="install-go" id="installGo" data-i18n="installGo"></button>
      <button class="install-x" id="installX" data-i18n-title="noThanks">✕</button>
    </div>
    <button class="primary-btn" id="reportBtn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      <span data-i18n="reportBtn"></span>
    </button>
    <div class="credits">
      <button id="installLink" data-i18n="install"></button>
      <span data-i18n="mapCredit"></span> &copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>
      <div class="credits-legal">
        <a href="legal.html#privacy" data-i18n="privacy"></a> · <a href="legal.html#terms" data-i18n="terms"></a> · <button class="credit-btn" id="deleteLink" data-i18n="deleteData"></button>
      </div>
    </div>
  </div>

  <div id="osmMini">&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a></div>
  <button id="fab" data-i18n-title="reportBtn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
  </button>

  <div id="placeBar">
    <p data-i18n="placeHint"></p>
    <div id="placeDist"></div>
    <div class="place-actions">
      <button class="secondary-btn" id="placeGps" data-i18n="useGps"></button>
      <button class="primary-btn" id="placeDone" data-i18n="done"></button>
    </div>
  </div>
</div>

<div id="popup">
  <button class="popup-close" onclick="closePopup()" data-i18n-title="close">✕</button>
  <div id="popupContent"></div>
</div>

<!-- formulario de reporte -->
<div class="sheet-bg" id="modalBg">
  <div class="sheet" id="modal">
    <div class="modal-title"><span class="modal-orca" id="modalOrca"></span><span data-i18n="newSighting"></span><button class="modal-close" id="closeModal" data-i18n-title="close">✕</button></div>
    <div class="field-label" data-i18n="typeLabel"></div>
    <div class="type-grid">
      <button class="type-btn" data-type="observation" data-color="green"><span class="type-dot" style="background:var(--green)"></span><span data-i18n="observation"></span></button>
      <button class="type-btn" data-type="interaction" data-color="orange"><span class="type-dot" style="background:var(--orange)"></span><span data-i18n="interaction"></span></button>
      <button class="type-btn" data-type="contact" data-color="red"><span class="type-dot" style="background:var(--red)"></span><span data-i18n="contact"></span></button>
    </div>
    <button class="proto-banner" id="protoBanner"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><path d="M5.6 5.6l3.6 3.6M14.8 14.8l3.6 3.6M18.4 5.6l-3.6 3.6M9.2 14.8l-3.6 3.6"/></svg><span data-i18n="protoBanner"></span>›</button>
    <div class="field-label" data-i18n="countLabel"></div>
    <div class="count-row">
      <button class="count-btn" id="countMinus">−</button>
      <span id="countVal">1</span>
      <button class="count-btn" id="countPlus">+</button>
    </div>
    <div class="field-label" data-i18n="locationLabel"></div>
    <div class="loc-row" id="locRow">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.3-7-11.5A7 7 0 0 1 19 9.5C19 14.7 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
      <div class="loc-text" id="locText"></div>
      <button class="loc-adjust" id="locAdjust" data-i18n="adjust"></button>
    </div>
    <div class="field-label" data-i18n="notesLabel"></div>
    <textarea class="notes-input" id="notesInput" rows="2" maxlength="200" data-i18n-ph="notesPh"></textarea>
    <button class="primary-btn" id="submitBtn" data-i18n="submit"></button>
    <p class="form-legal" id="formLegal"></p>
  </div>
</div>

<!-- ayuda cuando la ubicación está bloqueada -->
<div class="sheet-bg" id="helpBg">
  <div class="sheet">
    <div class="modal-title"><span id="helpTitle"></span><button class="modal-close" id="closeHelp" data-i18n-title="close">✕</button></div>
    <p class="help-intro" id="helpIntro"></p>
    <ol class="help-steps" id="helpSteps"></ol>
    <p class="help-after" id="helpAfter"></p>
    <button class="primary-btn" id="okHelp" data-i18n="gotIt"></button>
  </div>
</div>

<!-- qué hacer si te encuentras orcas -->
<div class="sheet-bg" id="protoBg">
  <div class="sheet">
    <div class="modal-title"><span class="modal-orca" style="color:var(--orange)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><path d="M5.6 5.6l3.6 3.6M14.8 14.8l3.6 3.6M18.4 5.6l-3.6 3.6M9.2 14.8l-3.6 3.6"/></svg></span><span data-i18n="protoTitle"></span><button class="modal-close" id="closeProto" data-i18n-title="close">✕</button></div>
    <p class="proto-intro" data-i18n="protoIntro"></p>
    <div id="protoBody"></div>
    <button class="primary-btn" id="okProto" data-i18n="gotIt"></button>
  </div>
</div>

<!-- mi historial -->
<div class="sheet-bg" id="histBg">
  <div class="sheet">
    <div class="modal-title"><span class="modal-orca" id="histOrca"></span><span data-i18n="myHistory"></span><button class="modal-close" id="closeHist" data-i18n-title="close">✕</button></div>
    <div class="hist-sub" id="histSub"></div>
    <ul class="hist-list" id="histList"></ul>
    <p class="hist-note" data-i18n="histNote"></p>
    <button class="primary-btn" id="okHist" data-i18n="gotIt"></button>
  </div>
</div>

<!-- borrar mis datos -->
<div class="sheet-bg" id="delBg">
  <div class="sheet">
    <div class="modal-title"><span data-i18n="delTitle"></span><button class="modal-close" id="closeDel" data-i18n-title="close">✕</button></div>
    <p class="sheet-text" data-i18n="delText"></p>
    <p class="sheet-text" data-i18n="delText2"></p>
    <div class="sheet-actions">
      <button class="secondary-btn" id="cancelDel" data-i18n="cancel"></button>
      <button class="danger-btn" id="confirmDel" data-i18n="delConfirm"></button>
    </div>
  </div>
</div>

<div id="toast"></div>

function detectLang() {

  for (const l of (navigator.languages || [navigator.language || 'en'])) {
    const code = String(l).slice(0, 2).toLowerCase();
    if (I18N[code]) return code;
  }
  return 'en';
}

function t(key, vars) {
  let s = (I18N[lang] && I18N[lang][key]) ?? I18N.en[key] ?? key;
  if (vars && typeof s === 'string') for (const k in vars) s = s.replace('{' + k + '}', vars[k]);
  return s;
}

function esc(str) { return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function ageMins(ts) { return (Date.now() - ts) / 60000; }
function getOp(ts, maxH) {
  const m = ageMins(ts), mx = maxH * 60;
  if (m > mx) return 0;
  return Math.max(.12, 1 - (m / mx) * .88);
}
function fmtT(ts) {
  const rtf = new Intl.RelativeTimeFormat(lang, { numeric:'always', style:'short' });
  const m = ageMins(ts);
  if (m < 60)   return rtf.format(-Math.max(1, Math.round(m)), 'minute');
  if (m < 1440) return rtf.format(-Math.round(m / 60), 'hour');
  return rtf.format(-Math.round(m / 1440), 'day');
}
function fmtDist(meters) {
  const nf = new Intl.NumberFormat(lang, { maximumFractionDigits: meters < 10000 ? 1 : 0 });
  return meters < 1000 ? Math.round(meters / 10) * 10 + ' m' : nf.format(meters / 1000) + ' km';
}
function navInfo(s) {
  const R = 3440.065;                                   // radio de la Tierra en millas náuticas
  const toR = d => d * Math.PI / 180, f1 = toR(userLat), f2 = toR(s.lat), dl = toR(s.lng - userLng);
  const a = Math.sin((f2 - f1) / 2) ** 2 + Math.cos(f1) * Math.cos(f2) * Math.sin(dl / 2) ** 2;
  const nm = 2 * R * Math.asin(Math.min(1, Math.sqrt(a)));
  const y = Math.sin(dl) * Math.cos(f2), x = Math.cos(f1) * Math.sin(f2) - Math.sin(f1) * Math.cos(f2) * Math.cos(dl);
  const brg = Math.round((Math.atan2(y, x) * 180 / Math.PI + 360) % 360) % 360;
  const d = new Intl.NumberFormat(lang, nm < 10 ? { minimumFractionDigits:1, maximumFractionDigits:1 } : { maximumFractionDigits:0 }).format(nm);
  return t('navInfo', { d, b: String(brg).padStart(3, '0') });
}

  for (let i = 0; i < 3; i++) {
    try {
      ({ data, error } = await sb.from('sightings').select(colsSel())
        .gte('created_at', since).order('created_at', { ascending:false }).limit(1000));
    } catch (e) { error = e; }
    if (!error || !noteMissingCols(error)) break;
  }
  if (error) { console.error(error); setOnline(false); return; }
  setOnline(true);
  sightings = data.map(fromRow);
  saveSnapshot(); mergePending(); renderMarkers(); refreshPopup();
}

// ── cola de avistamientos sin enviar ──
function loadQueue() { try { return JSON.parse(localStorage.getItem('orcinus_queue') || '[]'); } catch (e) { return []; } }
function saveQueue(q) { try { localStorage.setItem('orcinus_queue', JSON.stringify(q)); } catch (e) {} }
let queue = loadQueue();
function newId() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); });
}
function pendingFromItem(it) {
  const p = it.payload;
  return { id:p.id, pending:true, lat:p.lat, lng:p.lng, type:p.type, color:TYPE_COLOR[p.type], time:Date.parse(p.observed_at),
           count:p.count, notes:p.notes || '', confirms:0, source:p.source || null };
}
function mergePending() { queue.forEach(it => { if (!sightings.some(s => s.id === it.payload.id)) sightings.unshift(pendingFromItem(it)); }); }
// ── mi historial (solo en este dispositivo) ──
function loadHistory() { try { return JSON.parse(localStorage.getItem('orcinus_history') || '[]'); } catch (e) { return []; } }
let histItems = loadHistory();
function recordHistory(x) {
  if (histItems.some(h => h.id === x.id)) return;
  histItems.unshift({ id:x.id, type:x.type, count:x.count, notes:x.notes || '', lat:x.lat, lng:x.lng, source:x.source || null,
                    time:x.time || Date.parse(x.observed_at) || Date.now() });
  histItems = histItems.slice(0, 300);
  try { localStorage.setItem('orcinus_history', JSON.stringify(histItems)); } catch (e) {}
}
function forgetHistory(id) {
  histItems = histItems.filter(h => h.id !== id);
  try { localStorage.setItem('orcinus_history', JSON.stringify(histItems)); } catch (e) {}
}
function enqueue(payload) {
  recordHistory(payload);
  queue.push({ payload, at:Date.now() }); saveQueue(queue);
  mine.add(payload.id); saveSet('orcinus_mine', mine);
  upsertLocal(pendingFromItem(queue[queue.length - 1]));
}
// Envía un avistamiento → { ok, row } | { net:true } | { err }
async function sendPayload(payload) {
  const ses = await ensureSession();
  if (ses !== 'ok') return ses === 'net' ? { net:true } : { err:{ message:'session' } };
  for (let i = 0; i < 4; i++) {
    const body = { ...payload };
    OPT_COLS.forEach(c => { if (missingCols.has(c)) delete body[c]; });
    if (!canSendId) delete body.id;
    let res;
    try { res = await sb.from('sightings').insert(body).select(colsSel()).single(); }
    catch (e) { return isNetErr(e) ? { net:true } : { err:e }; }
    if (!res.error) return { ok:true, row:res.data };
    const e = res.error;
    if (isNetErr(e)) return { net:true };
    if (e.code === '23505') return { ok:true, row:null };            // ya había llegado (reintento): no duplicar
    if (noteMissingCols(e)) continue;                                 // migración pendiente: reintentar sin esa columna
    if (canSendId && e.code === '42501') { canSendId = false; continue; }   // sin permiso para elegir id: reintentar sin él
    return { err:e };
  }
  return { err:{ message:'retries' } };
}
let flushing = false;
async function flushQueue() {
  if (!sb || flushing || !queue.length || navigator.onLine === false) return;
  flushing = true; let sent = 0;
  try {
    while (queue.length) {
      const it = queue[0];
      const r = await sendPayload(it.payload);
      if (r.net) break;                                               // sigue sin red: reintentar más tarde
      if (r.err && /rate_limit/.test(r.err.message || '')) break;     // límite por hora: reintentar más tarde
      queue.shift(); saveQueue(queue);
      if (r.ok) {
        sent++;
        if (r.row) { mine.add(r.row.id); saveSet('orcinus_mine', mine); upsertLocal(fromRow(r.row)); }
        else { const s = sightings.find(x => x.id === it.payload.id); if (s) s.pending = false; }
      } else {
        console.error(r.err);
        sightings = sightings.filter(x => x.id !== it.payload.id);
        forgetHistory(it.payload.id);
        showToast(t('tQueueDropped'));
      }
    }
  } finally { flushing = false; }
  if (sent) { setOnline(true); renderMarkers(); refreshPopup(); showToast(t('tQueueSent')); fetchSightings(); }
  else renderMarkers();
}
function subscribeRealtime() {
  sb.channel('sightings-live')
    .on('postgres_changes', { event:'*', schema:'public', table:'sightings' }, p => {
      if (p.eventType === 'DELETE') sightings = sightings.filter(x => x.id !== p.old.id);
      else if (p.new && p.new.id) upsertLocal(fromRow(p.new));
      renderMarkers();
    })
    .subscribe(status => { if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') setOnline(false); });
}

// No se pide al abrir la app: solo al pulsar "mi ubicación" o "reportar".
let userLat = null, userLng = null, hasFix = false, userMarker = null;
let geoState = navigator.geolocation ? 'unknown' : 'unsupported';   // unknown | prompt | granted | denied | unsupported
let watchId = null, centerOnFix = false, geoRequestedAt = 0;
const geoListeners = [];

const LocateCtl = L.Control.extend({
  options:{ position:'topleft' },
  onAdd() {
    const div = L.DomUtil.create('div', 'leaflet-bar locate-ctl');
    div.innerHTML = `<a role="button" href="#">${ICON_LOCATE}</a>`;
    L.DomEvent.disableClickPropagation(div);
    L.DomEvent.on(div.firstChild, 'click', e => { L.DomEvent.preventDefault(e); onLocateClick(); });
    return div;
  },
});
const locateCtl = new LocateCtl().addTo(map);
function updateLocateCtl() {
  const el = locateCtl.getContainer();
  el.classList.toggle('on', hasFix);
  el.classList.toggle('denied', geoState === 'denied');
  el.classList.toggle('busy', watchId !== null && !hasFix && geoState !== 'denied');
  el.firstChild.title = t('locate'); el.firstChild.setAttribute('aria-label', t('locate'));
}
function onGeoSuccess(pos) {
  hasFix = true; geoState = 'granted';
  userLat = pos.coords.latitude; userLng = pos.coords.longitude;
  const icon = L.divIcon({ className:'', html:'<div class="user-pin"></div>', iconSize:[18, 18], iconAnchor:[9, 9] });
  if (!userMarker) userMarker = L.marker([userLat, userLng], { icon, zIndexOffset:-100, interactive:false }).addTo(map);
  else userMarker.setLatLng([userLat, userLng]);
  if (centerOnFix) { centerOnFix = false; map.setView([userLat, userLng], Math.max(map.getZoom(), 12)); }
  updateLocateCtl(); geoListeners.forEach(f => f());
}
function onGeoError(err) {
  if (err.code === 1) {                       // permiso denegado
    geoState = 'denied';
    if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
    // Si la respuesta es instantánea, el navegador ni preguntó: estaba bloqueado de antes → explicar cómo activarlo.
    // Si el usuario acaba de pulsar "Bloquear", no insistir.
    if (centerOnFix) { centerOnFix = false; if (Date.now() - geoRequestedAt < 800) showGeoHelp(); }
  } else if (centerOnFix && !hasFix) { centerOnFix = false; showToast(t('tGeoErr')); }
  updateLocateCtl(); geoListeners.forEach(f => f());
}
function startGeo() {
  if (!navigator.geolocation || watchId !== null || geoState === 'denied') return;
  geoRequestedAt = Date.now();
  watchId =navigator.geolocation.watchPosition(onGeoSuccess, onGeoError, { enableHighAccuracy:true, maximumAge:15000, timeout:30000 });
  updateLocateCtl();
}
function onLocateClick() {
  if (geoState === 'unsupported') { showToast(t('tGeoNo')); return; }
  if (geoState === 'denied') { showGeoHelp(); return; }
  if (hasFix) { map.setView([userLat, userLng], Math.max(map.getZoom(), 12)); return; }
  centerOnFix = true; startGeo();
}
// Saber el estado del permiso sin preguntar al usuario
if (navigator.permissions && navigator.geolocation) {
  navigator.permissions.query({ name:'geolocation' }).then(st => {
    const apply = () => {
      geoState = st.state;                      // granted | prompt | denied
      if (st.state === 'granted') startGeo();   // ya dio permiso antes: empezar sin preguntar
      updateLocateCtl(); geoListeners.forEach(f => f());
    };
    apply(); st.onchange = apply;
  }).catch(() => {});
}

function collapsedOffset() {
  const safe = Math.max(0, parseFloat(getComputedStyle(panel).paddingBottom) - 14);   // zona de la barra de inicio del móvil
  return Math.max(0, panel.offsetHeight - panelGrab.offsetHeight - safe);
}
function setPanelCollapsed(v, persist) {
  panelCollapsed = v;
  panel.style.transform = v ? `translateY(${collapsedOffset()}px)` : '';
  document.body.classList.toggle('panel-collapsed', v);
  panelGrab.setAttribute('aria-expanded', String(!v));

let drag = null;

  if (e.button > 0) return;
  panelGrab.setPointerCapture(e.pointerId);
  drag = { y0:e.clientY, t0:performance.now(), base:panelCollapsed ? collapsedOffset() : 0, max:collapsedOffset(), y:null, last:e.clientY, lastT:performance.now(), v:0 };
  panel.style.transition = 'none';
});
panelGrab.addEventListener('pointermove', e => {
  if (!drag) return;
  const now = performance.now();
  drag.v = (e.clientY - drag.last) / Math.max(1, now - drag.lastT);   // px/ms
  drag.last = e.clientY; drag.lastT = now;
  drag.y = Math.min(drag.max, Math.max(0, drag.base + e.clientY - drag.y0));
  panel.style.transform = `translateY(${drag.y}px)`;
});
function endDrag(e) {
  if (!drag) return;
  const d = drag; drag = null;
  panel.style.transition = '';
  const moved = Math.abs(e.clientY - d.y0);
  if (moved < 6) { setPanelCollapsed(!panelCollapsed, true); return; }            // un toque: alternar
  const collapse = d.v > 0.4 ? true : d.v < -0.4 ? false : (d.y ?? d.base) > d.max / 2;
  setPanelCollapsed(collapse, true);
}

protoBg.addEventListener('click', e => { if (e.target === protoBg) protoBg.classList.remove('open'); });
document.getElementById('countMinus').addEventListener('click', () => { if (cnt > 1) countVal.textContent = --cnt; });
document.getElementById('countPlus').addEventListener('click',  () => { if (cnt < 50) countVal.textContent = ++cnt; });
document.getElementById('locAdjust').addEventListener('click', () => startPlacing(false));

// ── colocar el punto en el mapa ──
let placing = false, placeMarker = null;
const placeIcon = L.divIcon({ className:'', iconSize:[36, 46], iconAnchor:[18, 44], html:`<div class="place-pin"><div class="place-head">${ORCA}</div></div>` });
function startPlacing(thenSubmit) {
  submitAfterPlace = thenSubmit;
  closeForm(); closePopup();
  placing = true; document.body.classList.add('placing');
  const start = reportPos ? L.latLng(reportPos.lat, reportPos.lng) : (hasFix ? L.latLng(userLat, userLng) : map.getCenter());
  placeMarker = L.marker(start, { icon:placeIcon, draggable:true, autoPan:true, zIndexOffset:1000 }).addTo(map);
  placeMarker.on('drag', updatePlaceBar);
  map.panTo(start);
  updatePlaceBar();
}
function updatePlaceBar() {
  if (!placeMarker) return;
  const p = placeMarker.getLatLng();
  document.getElementById('placeDist').textContent = hasFix
    ? t('distance', { d:fmtDist(map.distance([userLat, userLng], p)) })
    : `${p.lat.toFixed(4)}, ${p.lng.toFixed(4)}`;
  document.getElementById('placeGps').style.display = hasFix ? '' : 'none';
}
function endPlacing(pos) {
  placing = false; document.body.classList.remove('placing');
  if (placeMarker) { map.removeLayer(placeMarker); placeMarker = null; }
  reportPos = pos;
  updateLocLine(); modalBg.classList.add('open');
  if (submitAfterPlace) { submitAfterPlace = false; doSubmit(); }
}
map.on('click', e => { if (placing && placeMarker) { placeMarker.setLatLng(e.latlng); updatePlaceBar(); } else closePopup(); });
document.getElementById('placeDone').addEventListener('click', () => {
  const p = placeMarker.getLatLng();
  // Si apenas se movió del GPS (menos de 15 m), se sigue considerando GPS
  const isGps = hasFix && map.distance([userLat, userLng], p) < 15;
  endPlacing({ lat:p.lat, lng:p.lng, source: isGps ? 'gps' : 'manual' });
});
document.getElementById('placeGps').addEventListener('click', () => { if (hasFix) endPlacing({ lat:userLat, lng:userLng, source:'gps' }); });

// ── envío ──
async function doSubmit() {
  if (!selType) { showToast(t('tPickType')); return; }
  if (!reportPos) { startPlacing(true); return; }    // sin GPS ni punto marcado: pedir que lo marque
  const payload = {
    id:newId(), observed_at:new Date().toISOString(),          // hora real, aunque se envíe más tarde
    lat:+reportPos.lat.toFixed(5), lng:+reportPos.lng.toFixed(5), type:selType, count:cnt,
    notes:document.getElementById('notesInput').value.trim().slice(0, 200),
    source:reportPos.source,
  };
  const finish = (s, msg) => {
    closeForm(); resetForm(); renderMarkers();
    map.setView([s.lat, s.lng], map.getZoom());
    showToast(msg);
  };
  if (!sb) {                                                   // modo demo
    const s = { ...payload, color:TYPE_COLOR[selType], time:Date.now(), confirms:0 };
    mine.add(s.id); saveSet('orcinus_mine', mine); upsertLocal(s); save(); recordHistory(s);
    return finish(s, t('tAdded'));
  }
  // Sin cobertura (o si se corta a medio envío): a la cola, se enviará solo al volver la señal
  if (navigator.onLine === false) { enqueue(payload); return finish(payload, t('tQueued')); }
  submitBtn.disabled = true; submitBtn.textContent = t('sending');
  const r = await sendPayload(payload);
  submitBtn.disabled = false; submitBtn.textContent = t('submit');
  if (r.net) { setOnline(false); enqueue(payload); return finish(payload, t('tQueued')); }
  if (r.err) { console.error(r.err); showToast(/rate_limit/.test(r.err.message || '') ? t('tRate') : t('tSendErr')); return; }
  const s = r.row ? fromRow(r.row) : { ...payload, color:TYPE_COLOR[selType], time:Date.now(), confirms:0 };
  mine.add(s.id); saveSet('orcinus_mine', mine); upsertLocal(s); recordHistory(s);
  setOnline(true);
  finish(s, t('tAdded'));
}
submitBtn.addEventListener('click', doSubmit);

// ══ tema ══════════════════════════════════════════════
const themeBtn = document.getElementById('themeBtn');
function currentTheme() { return document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark'; }
function applyTheme(th, persist) {
  document.documentElement.setAttribute('data-theme', th);
  document.querySelector('meta[name="theme-color"]').setAttribute('content', th === 'light' ? '#ffffff' : '#0d1f2d');
  themeBtn.innerHTML = th === 'light' ? ICON_MOON : ICON_SUN;   // muestra a qué tema se cambia
  if (persist) { try { localStorage.setItem('orcinus_theme', th); } catch (e) {} }
}
themeBtn.addEventListener('click', () => applyTheme(currentTheme() === 'light' ? 'dark' : 'light', true));
if (window.matchMedia) matchMedia('(prefers-color-scheme: light)').addEventListener?.('change', e => {
  let saved = null; try { saved = localStorage.getItem('orcinus_theme'); } catch (_) {}
  if (!saved) applyTheme(e.matches ? 'light' : 'dark', false);   // seguir al sistema mientras no se elija a mano
});
applyTheme(currentTheme(), false);

// ══ idioma ════════════════════════════════════════════
const langMenu = document.getElementById('langMenu');
function applyLang(code, persist) {
  lang = I18N[code] ? code : 'en';
  if (persist) { try { localStorage.setItem('orcinus_lang', lang); } catch (e) {} }
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll('[data-i18n-ph]').forEach(el => el.placeholder = t(el.dataset.i18nPh));
  document.querySelectorAll('[data-i18n-title]').forEach(el => { el.title = t(el.dataset.i18nTitle); el.setAttribute('aria-label', t(el.dataset.i18nTitle)); });
  document.getElementById('langCode').textContent = lang.toUpperCase();
  langMenu.innerHTML = Object.entries(LANGS).map(([c, name]) =>
    `<button data-lang="${c}" class="${c === lang ? 'current' : ''}">${name}<span>${c.toUpperCase()}</span></button>`).join('');
  if (submitBtn.disabled) submitBtn.textContent = t('sending');
  renderFormLegal();
  updateSliderLabel(); renderMarkers(); refreshPopup(); updateLocateCtl();
  if (modalBg.classList.contains('open')) updateLocLine();
  if (helpBg.classList.contains('open')) renderHelp();
  if (protoBg.classList.contains('open')) renderProto();
  if (histBg.classList.contains('open')) renderHistory();
  if (placing) updatePlaceBar();
}
document.getElementById('langBtn').addEventListener('click', e => { e.stopPropagation(); langMenu.classList.toggle('open'); });
langMenu.addEventListener('click', e => { const b = e.target.closest('button[data-lang]'); if (b) { applyLang(b.dataset.lang, true); langMenu.classList.remove('open'); } });
document.addEventListener('click', e => { if (!e.target.closest('.lang-wrap')) langMenu.classList.remove('open'); });

// ══ aviso flotante ════════════════════════════════════
let toastTimer = null;
function showToast(msg) {
  const el = document.getElementById('toast');
  const bar = document.body.classList.contains('placing') ? document.getElementById('placeBar') : document.getElementById('panel');
  if (document.querySelector('.sheet-bg.open')) el.style.bottom = (window.innerHeight - 140) + 'px';   // con una hoja abierta, arriba para no taparla
  else el.style.bottom = Math.max(16, window.innerHeight - bar.getBoundingClientRect().top + 16) + 'px';   // justo encima de lo visible del panel
  el.textContent = msg; el.style.display = 'block'; el.style.opacity = '1';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.style.opacity = '0'; setTimeout(() => { el.style.display = 'none'; }, 300); }, 2600);
}

// ══ mi historial ══════════════════════════════════════
const histBg = document.getElementById('histBg');
document.getElementById('histOrca').innerHTML = ORCA;
function renderHistory() {
  // Avistamientos propios que ya estaban en el mapa antes de existir el historial
  sightings.forEach(s => { if (mine.has(s.id) && !s.pending) recordHistory(s); });
  const df = new Intl.DateTimeFormat(lang, { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' });
  document.getElementById('histSub').textContent = histItems.length ? t('histSent', { n:histItems.length }) : '';
  document.getElementById('histList').innerHTML = !histItems.length ? `<li class="hist-empty">${esc(t('histEmpty'))}</li>` : histItems.map(h => {
    const live = sightings.find(s => s.id === h.id);
    const pend = queue.some(q => q.payload.id === h.id);
    const status = pend ? `<div class="hist-status pend">${esc(t('pending'))}</div>`
      : live ? `<div class="hist-status on">${esc(t('histOnMap', { n:live.confirms }))}</div>`
      : `<div class="hist-status">${esc(t('histArchived'))}</div>`;
    const src = h.source === 'manual' ? t('srcManual') : h.source === 'gps' ? t('srcGps') : '';
    const meta = [h.count > 1 ? t('individuals', { n:h.count }) : '', src, `${h.lat.toFixed(4)}, ${h.lng.toFixed(4)}`].filter(Boolean).join(' · ');
    return `<li><button class="hist-item" data-id="${esc(h.id)}">
      <span class="hist-dot" style="background:${typeC(TYPE_COLOR[h.type])}"></span>
      <span class="hist-main"><span class="hist-top"><span>${esc(typeL(h.type))}</span><span class="hist-date">${esc(df.format(h.time))}</span></span>
      <div class="hist-meta">${esc(meta)}</div>${h.notes ? `<div class="hist-notes">${esc(h.notes)}</div>` : ''}${status}</span></button></li>`;
  }).join('');
}
document.getElementById('histBtn').addEventListener('click', () => { closePopup(); renderHistory(); histBg.classList.add('open'); });
document.getElementById('closeHist').onclick = document.getElementById('okHist').onclick = () => histBg.classList.remove('open');
histBg.addEventListener('click', e => { if (e.target === histBg) histBg.classList.remove('open'); });
document.getElementById('histList').addEventListener('click', e => {
  const b = e.target.closest('.hist-item'); if (!b) return;
  const h = histItems.find(x => x.id === b.dataset.id); if (!h) return;
  histBg.classList.remove('open');
  map.setView([h.lat, h.lng], Math.max(map.getZoom(), 12));
  const live = sightings.find(s => s.id === h.id);
  if (live) map.once('moveend', () => showPopup(live));
});

// ══ legal y borrar mis datos ══════════════════════════
function renderFormLegal() {
  const link = (href, key) => `<a href="${href}">${esc(t(key))}</a>`;
  document.getElementById('formLegal').innerHTML = esc(t('formLegal'))
    .replace('{terms}', link('legal.html#terms', 'termsLink'))
    .replace('{privacy}', link('legal.html#privacy', 'privacyLink'));
}
const delBg = document.getElementById('delBg');
const confirmDel = document.getElementById('confirmDel');
const closeDelSheet = () => delBg.classList.remove('open');
document.getElementById('deleteLink').addEventListener('click', () => { closePopup(); delBg.classList.add('open'); });
document.getElementById('closeDel').onclick = document.getElementById('cancelDel').onclick = closeDelSheet;
delBg.addEventListener('click', e => { if (e.target === delBg) closeDelSheet(); });
function wipeLocalData() {
  ['orcinus_mine', 'orcinus_confirmed', 'orcinus_reported', 'orcinus_queue', 'orcinus_v5', 'orcinus_history'].forEach(k => { try { localStorage.removeItem(k); } catch (e) {} });
  mine.clear(); confirmed.clear(); reported.clear();
  queue = []; histItems = []; sightings = sightings.filter(s => !s.pending);
}
confirmDel.addEventListener('click', async () => {
  if (sb) {
    if (navigator.onLine === false) { showToast(t('tDeleteOffline')); return; }
    confirmDel.disabled = true; confirmDel.textContent = t('deleting');
    let ok = true;
    try {
      const { data } = await sb.auth.getSession();
      if (data.session) {                                  // sin sesión no hay nada guardado en el servidor
        const { error } = await sb.rpc('delete_my_data');
        if (error) { console.error(error); ok = false; }
        else await sb.auth.signOut({ scope:'local' }).catch(() => {});
      }
    } catch (e) { console.error(e); ok = false; }
    confirmDel.disabled = false; confirmDel.textContent = t('delConfirm');
    if (!ok) { showToast(t('tDeleteErr')); return; }
    wipeLocalData(); closeDelSheet(); closePopup(); renderMarkers(); fetchSightings();
  } else {
    wipeLocalData(); sightings = SAMPLE.slice(); closeDelSheet(); renderMarkers();
  }
  showToast(t('tDeleted'));
});

// ══ instalar en el móvil ══════════════════════════════
// Tarjeta visible en el panel + enlace pequeño junto a los créditos.
// Solo aparecen si el navegador permite instalar y la app no está ya instalada.
// Si se cierra la tarjeta, no vuelve a salir en 30 días (el enlace pequeño sigue).
const installLink = document.getElementById('installLink');
const installCard = document.getElementById('installCard');
document.getElementById('installIcon').innerHTML = ORCA;
let installPrompt = null;
const isStandalone = () => (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
const isAndroidBrave = () => !!navigator.brave && /Android/i.test(navigator.userAgent);
function cardDismissed() {
  try { return Date.now() - Number(localStorage.getItem('orcinus_install_dismissed') || 0) < 30 * 86400000; } catch (e) { return false; }
}
function setInstallable(on) {
  installLink.classList.toggle('show', on);
  installCard.classList.toggle('show', on && !cardDismissed());
}
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installPrompt = e; setInstallable(true); });
window.addEventListener('appinstalled', () => { installPrompt = null; setInstallable(false); });
if (isIOS() && !isStandalone()) setInstallable(true);      // iPhone no tiene aviso automático: explicarlo
async function doInstall() {
  if (installPrompt) {
    installPrompt.prompt();
    const { outcome } = await installPrompt.userChoice;
    installPrompt = null;
    if (outcome === 'accepted') {
      setInstallable(false);
      if (isAndroidBrave()) setTimeout(() => showToast(t('braveHint')), 2500);   // Brave en Android a veces no la instala bien
    }
  } else showHelp('install');
}
installLink.addEventListener('click', doInstall);
document.getElementById('installGo').addEventListener('click', doInstall);
document.getElementById('installX').addEventListener('click', () => {
  try { localStorage.setItem('orcinus_install_dismissed', String(Date.now())); } catch (e) {}
  installCard.classList.remove('show');
});

// ══ arranque ══════════════════════════════════════════
if (sb) { sightings = loadSnapshot(); mergePending(); }    // lo último conocido, por si no hay cobertura
applyLang(lang, false);
setInterval(() => { renderMarkers(); refreshPopup(); }, 60000);   // actualizar transparencias y "hace X min"
if (sb) {
  if (navigator.onLine === false) setOnline(false);
  fetchSightings().then(flushQueue);
  subscribeRealtime();
  setInterval(fetchSightings, 120000);
  setInterval(flushQueue, 30000);
  window.addEventListener('online',  () => { fetchSightings().then(flushQueue); });
  window.addEventListener('offline', () => setOnline(false));
  document.addEventListener('visibilitychange', () => { if (!document.hidden) fetchSightings().then(flushQueue); });
}
// Service worker: permite abrir la app sin cobertura (no funciona abriendo el archivo directamente)
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(e => console.warn('SW', e)));
}
</script>
