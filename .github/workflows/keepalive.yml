name: Mantener Supabase activo
on:
  schedule:
    - cron: '17 6 */3 * *'   # cada 3 días
  workflow_dispatch:          # permite lanzarlo a mano
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar la base de datos
        run: |
          curl -sS -f -o /dev/null -w "HTTP %{http_code}\n" \
            "https://xfktydldllfzqqpftjbn.supabase.co/rest/v1/sightings?select=id&limit=1" \
            -H "apikey: sb_publishable_7avcbtmPIMor47EsCztvnQ_694IJc81"
